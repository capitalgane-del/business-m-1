  suburb: "Greenway",
  address: "Mortimer Lewis Dr, Greenway ACT 2900",

  // Structured-data facts. These are never rendered as visible copy — they are

  // guessing them out of the prose.
  geo: { lat: -35.4074555, lng: 149.0709704 }, // from the business's Google listing
  addressParts: {

  priceRange: "$",

  // Replaces the business name in both the header and the footer. The wordmark

  heroHeading: "Great Coffee, Right by Lake Tuggeranong",
  ctaText: "Call to Order",

    linkText: "the Mimi's Pit Stop Facebook page",
    url: FACEBOOK_URL

      author: "Brett Gray · Local Guide, Google",

      author: "gustavo smith · Local Guide, Google",
      stars: 5

  // Deep link to the Google listing's review tab (the !1b1 in the URL is what

  moreReviews: {
    url: "https://www.google.com/maps/place/Mimi's+Pit+Stop/@-35.405754,149.068047,16.46z/data=!4m8!3m7!1s0x6b17b5632547bc51:0x89d686a33f60fdfc!8m2!3d-35.4074555!4d149.0709704!9m1!1b1!16s%2Fg%2F11csbbv3hk?entry=ttu&g_ep=EgoyMDI2MDgxMi4wIKXMDSoASAFQAw%3D%3D",
    text: "50+ more happy reviews on Google"

  galleryHeading: "A Look Around the Van",

  gallery: [

    { src: PHOTOS.scones,  w: 526, h: 394, alt: "Warm scones with butter and golden syrup on a picnic table" },

  contactHeading: "Come Say Hello at the Pit Stop",

  // A street address is close to useless for a van parked by a lake — this is

  formButtonText: "Send Us a Message",

  web3formsKey: "3391f802-c7be-4c43-886b-ea0d077f343f",

    bg: "#F0E7D8"

<script>
  // Runs synchronously, before first paint — sets title, meta description,
  // and colour variables immediately so there's no flash of default values.
  document.title = content.pageTitle;
  document.querySelector('meta[name="description"]').setAttribute("content", content.metaDescription);

  // Keep the link-preview tags in step with content.js, so a reskin that only
  // edits content.js can't leave the static fallbacks above describing the
  // previous client. Then absolutise the relative URLs: og:image and og:url
  // are supposed to be absolute, and this is the only place the real origin is
  // actually known. Consumers that run JS (Google, Slack, Discord) get exact
  // URLs from this; Facebook's scraper does not run JS and falls back to the
  // relative values in the markup. To make Facebook exact, hardcode the real
  // domain into the tags above once it's known.
  const meta = (sel, value) => {
    const el = document.querySelector(sel);
    if (el && value) el.setAttribute("content", value);
  };
  meta('meta[property="og:title"]', content.pageTitle);
  meta('meta[name="twitter:title"]', content.pageTitle);
  meta('meta[property="og:description"]', content.metaDescription);
  meta('meta[name="twitter:description"]', content.metaDescription);
  meta('meta[property="og:site_name"]', content.businessName);

  const origin = location.origin;
  if (origin && origin !== "null") { // file:// gives "null" — leave relative there
    const abs = path => new URL(path, location.href).href;
    const canonical = document.querySelector('link[rel="canonical"]');
    if (canonical) canonical.href = abs(canonical.getAttribute("href"));
    for (const sel of ['meta[property="og:url"]', 'meta[property="og:image"]', 'meta[name="twitter:image"]']) {
      const el = document.querySelector(sel);
      if (el) el.setAttribute("content", abs(el.getAttribute("content")));
    }
  }
  document.documentElement.style.setProperty("--color-primary", content.colours.primary);
  document.documentElement.style.setProperty("--color-secondary", content.colours.secondary);
  document.documentElement.style.setProperty("--color-accent", content.colours.accent);
  // Optional — omit colours.bg and the near-neutral default in :root stands.
  if (content.colours.bg) {
    document.documentElement.style.setProperty("--color-bg", content.colours.bg);
  }
  if (content.heroImage) {
    document.documentElement.style.setProperty("--hero-image", `url("${content.heroImage}")`);
    document.documentElement.setAttribute("data-hero-image", "true");
  }
</script>

    --color-primary: #0057B8;

    --color-accent: #E0A82E;

    /* Page background — optional per client (colours.bg), falling back to this
       near-neutral. Only ever go light here: ink below is fixed, so a dark value
       would put dark text on a dark page. */
    --color-bg: #FAFAF9;

    /* Fixed tokens — not client-driven. Arbitrary client hex can't be trusted
       for body text contrast, so ink stays constant regardless of brand colour. */
    --color-ink: #201F1D;
    /* Tint of the page itself, not of white — so it stays a shade *of* the
       background whatever the client sets that to, instead of drifting lighter
       than the page and inverting the relationship. */
    --color-bg-alt: color-mix(in srgb, var(--color-primary) 8%, var(--color-bg));
    --color-border: color-mix(in srgb, var(--color-ink) 12%, transparent);

    --font-display: ui-sans-serif, system-ui, -apple-system, sans-serif;
    --font-body: system-ui, -apple-system, sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, monospace;

    --radius: 10px;
    --max-width: 1080px;
    /* Taller than the text-brand default so the logo roundel has room to read */
    --header-height: 92px;
    --hero-image: none;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    font-family: var(--font-body);
    line-height: 1.5;
    color: var(--color-ink);
    background: var(--color-bg);
    padding-top: var(--header-height);
  }

  h1, h2, .brand { overflow-wrap: break-word; word-break: break-word; }

  img { max-width: 100%; display: block; }
  a { color: inherit; text-decoration: none; }
  ul { list-style: none; }

  section {
    padding: 4rem 1.5rem;
    max-width: var(--max-width);
    margin: 0 auto;
  }

  h1, h2 { font-family: var(--font-display); font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
  h2 { font-size: clamp(1.5rem, 4vw, 2.25rem); margin-bottom: 2rem; }

  /* Structural labels — the mono/heading contrast is the page's typographic signature */
  .eyebrow {
    font-family: var(--font-mono);
    font-size: 0.75rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--color-primary);
    display: block;
    margin-bottom: 0.5rem;
  }

  a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--color-primary);
    outline-offset: 2px;
  }

  /* Skip link — offscreen until focused, then pinned over the fixed header.
     Keyboard and screen-reader users otherwise tab the header on every visit. */
  .skip-link {
    position: absolute;
    left: 0.5rem;
    top: -100%;
    z-index: 20;
    background: var(--color-accent);
    color: var(--color-secondary);
    font-weight: 700;
    padding: 0.75rem 1.25rem;
    border-radius: var(--radius);
  }
  .skip-link:focus { top: 0.5rem; }

  /* Honeypot. Bots fill every field they find; people never see this one.
     Deliberately not `display:none` — some bots skip hidden inputs, and this
     way it stays in the form for them while being unreachable for everyone
     else (offscreen, no tab stop, hidden from the accessibility tree). */
  .hp-field {
    position: absolute;
    left: -9999px;
    width: 1px;
    height: 1px;
    overflow: hidden;
  }

  /* Sits above the contact form — the plain-English "how do I find you". */
  .location-note {
    max-width: 55ch;
    margin-bottom: 2rem;
    margin-top: -1rem;
    font-size: 1.05rem;
    color: color-mix(in srgb, var(--color-ink) 85%, transparent);
  }

  .cta {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    font-family: var(--font-body);
    font-weight: 700;
    background: var(--color-primary);
    color: #fff;
    padding: 0.9rem 1.75rem;
    border-radius: var(--radius);
    border: none;
    cursor: pointer;
    font-size: 1rem;
  }

  /* --- Header --- */
  .site-header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
    padding: 0.85rem 1.25rem;
    /* Dark bar: the logo's wordmark is white, so it needs a dark backing.
       Matching the logo's own background colour is what removes the tile edge. */
    background: var(--color-secondary);
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  }
  .brand-logo {
    height: 64px;
    width: auto;
    flex-shrink: 0;
  }
  .phone-link {
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    flex-shrink: 0;
    font-family: var(--font-mono);
    font-weight: 700;
    /* On the dark bar the real logo gold finally works — paired with dark text
       instead of white, it reads at 8:1 rather than the 2.1:1 white would give. */
    background: var(--color-accent);
    color: var(--color-secondary);
    padding: 0.5rem 0.9rem;
    border-radius: 999px;
    font-size: 0.9rem;
  }

  /* --- Hero --- */
  #hero {
    position: relative;
    background-image: var(--hero-image);
    background-size: cover;
    background-position: center;
    text-align: center;
    padding-top: 5rem;
    padding-bottom: 5rem;
    max-width: none;
    overflow: hidden;
  }
  /* Plain tinted look by default; swaps to a dark scrim once a photo is set,
     so hero text stays readable regardless of what's in the image. */
  #hero::before {
    content: "";
    position: absolute;
    inset: 0;
    background: var(--color-bg-alt);
  }
  html[data-hero-image] #hero::before {
    background: linear-gradient(180deg, rgba(10,10,10,0.35), rgba(10,10,10,0.55));
  }
  #hero > * { position: relative; z-index: 1; }
  html[data-hero-image] #hero-heading { color: #fff; }
  html[data-hero-image] .trade-icon { color: #fff; }

  /* Sits under the hero CTA. Pill so it holds up over a photo as well as over
     the plain tinted hero. */
  .hero-hours {
    /* block + fit-content so it centres on its own line under the CTA rather
       than sitting inline beside it and competing with the button */
    display: block;
    width: fit-content;
    margin: 1.5rem auto 0;
    font-family: var(--font-mono);
    font-size: 0.85rem;
    letter-spacing: 0.04em;
    padding: 0.5rem 1rem;
    border-radius: 999px;
    border: 1px solid var(--color-border);
  }
  html[data-hero-image] .hero-hours {
    color: #fff;
    border-color: rgba(255, 255, 255, 0.35);
    background: rgba(0, 0, 0, 0.28);
  }

  .trade-icon {
    color: var(--color-primary);
    width: 48px;
    height: 48px;
    margin: 0 auto 1.5rem;
  }
  .trade-icon svg { width: 100%; height: 100%; }
  #hero-heading { font-size: clamp(2rem, 6vw, 3.25rem); max-width: 20ch; margin: 0 auto 2rem; }

  /* --- Services --- */
  /* Lead paragraph above the list. Wider measure than the cards but still
     capped, so the line length stays readable on a desktop-width section. */
  .services-note {
    max-width: 62ch;
    margin-bottom: 2rem;
    margin-top: -1rem; /* h2 already leaves 2rem below it; this tightens the pair */
    font-size: 1.05rem;
    color: color-mix(in srgb, var(--color-ink) 85%, transparent);
  }
  /* The Facebook link is the whole point of this paragraph, so it gets the
     brand colour and a permanent underline rather than hover-only — a link
     nobody notices is the same as no link. */
  .services-note a {
    color: var(--color-primary);
    font-weight: 700;
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  .services-list {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 1rem;
  }
  .services-list li {
    font-family: var(--font-display);
    font-weight: 700;
    padding: 1.25rem;
    background: #fff;
    border: 1px solid var(--color-border);
    border-left: 3px solid var(--color-primary);
    border-radius: var(--radius);
  }

  /* --- Testimonials --- */
  #testimonials-list {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 1.25rem;
  }
  .testimonial {
    background: #fff;
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    padding: 1.5rem;
  }
  .stars { color: var(--color-primary); letter-spacing: 0.1em; margin-bottom: 0.75rem; }
  .testimonial p:not(.testimonial-author) { font-style: italic; margin-bottom: 0.75rem; }
  .testimonial-author { font-family: var(--font-mono); font-size: 0.85rem; opacity: 0.75; }

  /* --- Gallery carousel ---
     A scroll-snap scroller rather than a JS-driven slider: the swipe is the
     browser's own, so it keeps native momentum and rubber-banding on touch and
     stays smooth without a single frame of JavaScript running. The buttons and
     dots just call scrollTo() and let the snap points do the rest.
     --per-view is fractional on purpose — a partly visible next slide is what
     tells you there is more to scroll, without needing a hint to say so. */
  .carousel {
    --gap: 1rem;
    --per-view: 2.5;
    position: relative;
  }
  .carousel-viewport {
    display: flex;
    gap: var(--gap);
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    scroll-behavior: smooth;
    /* Stops a horizontal swipe from triggering the browser's back gesture */
    overscroll-behavior-x: contain;
    /* The dots and the peeking slide communicate scrollability; a scrollbar
       under the photos just adds a grey line that shifts the layout. */
    scrollbar-width: none;
    -ms-overflow-style: none;
    padding-bottom: 4px; /* room for the focus ring, which would otherwise clip */
  }
  .carousel-viewport::-webkit-scrollbar { display: none; }
  .carousel-viewport:focus-visible {
    outline: 2px solid var(--color-primary);
    outline-offset: 4px;
  }
  .carousel-viewport .gallery-item {
    flex: 0 0 calc((100% - (var(--per-view) - 1) * var(--gap)) / var(--per-view));
    scroll-snap-align: start;
  }

  .carousel-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.75rem;
    margin-top: 1.25rem;
  }
  .carousel-btn {
    width: 44px;
    height: 44px;
    flex-shrink: 0;
    border-radius: 999px;
    border: 1px solid var(--color-border);
    background: #fff;
    color: var(--color-ink);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 1.1rem;
    line-height: 1;
  }
  .carousel-btn:disabled { opacity: 0.3; cursor: default; }
  .carousel-btn svg { width: 18px; height: 18px; }

  .carousel-dots { display: flex; align-items: center; gap: 0.15rem; }
  /* The visible dot is small, but the button around it is a full-height tap
     target — same 44px floor the rest of the page keeps to. */
  .carousel-dot {
    width: 22px;
    height: 44px;
    padding: 0;
    border: none;
    background: none;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .carousel-dot::before {
    content: "";
    width: 8px;
    height: 8px;
    border-radius: 999px;
    background: color-mix(in srgb, var(--color-ink) 30%, transparent);
    transition: width 0.2s ease, background-color 0.2s ease;
  }
  .carousel-dot[aria-current="true"]::before {
    width: 20px;
    background: var(--color-primary);
  }

  /* Diagonal hatch reads clearly as "placeholder", not a broken image */
  .gallery-item {
    aspect-ratio: 4 / 3;
    border: 1px dashed var(--color-border);
    border-radius: var(--radius);
    background: repeating-linear-gradient(
      45deg,
      var(--color-bg-alt),
      var(--color-bg-alt) 10px,
      var(--color-bg) 10px,
      var(--color-bg) 20px
    );
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 1rem;
    font-family: var(--font-mono);
    font-size: 0.8rem;
    color: color-mix(in srgb, var(--color-ink) 55%, transparent);
    position: relative;
    overflow: hidden;
  }
  /* Once a photo is actually in, drop the dashed placeholder outline — dashed
     is the "nothing here yet" signal and shouldn't frame a real image. */
  .gallery-item.has-photo {
    border-style: solid;
    padding: 0;
  }
  /* Sits over the hatch label, so the label is only seen if the photo fails */
  .gallery-item img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .reviews-link {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    min-height: 44px;
    margin-top: 1.5rem;
    font-family: var(--font-mono);
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--color-primary);
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .reviews-link::after { content: "→"; }

  /* --- Contact --- */
  #contact-form {
    display: flex;
    flex-direction: column;
    gap: 1rem;
    max-width: 480px;
    background: #fff;
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    padding: 1.5rem;
  }
  #contact-form label {
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
    font-family: var(--font-mono);
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  #contact-form input, #contact-form textarea {
    font-family: var(--font-body);
    font-size: 1rem;
    padding: 0.7rem;
    border: 1px solid var(--color-border);
    border-radius: 6px;
    text-transform: none;
    letter-spacing: normal;
  }
  #contact-form textarea { min-height: 100px; resize: vertical; }
  .form-success { font-family: var(--font-display); font-weight: 700; }
  .form-error { color: #B3261E; font-size: 0.9rem; margin-top: 0.5rem; }

  /* --- Footer --- */
  footer {
    background: var(--color-secondary);
    color: #fff;
    text-align: center;
    padding: 2rem 1.5rem;
    font-family: var(--font-mono);
    font-size: 0.85rem;
  }
  /* Same trick as the header — footer already used --color-secondary, so the
     feathered logo drops straight onto it. */
  .footer-logo {
    height: 76px;
    width: auto;
    margin: 0 auto 1rem;
  }
  .footer-hours {
    margin-top: 0.4rem;
    color: var(--color-accent);
  }

  @media (prefers-reduced-motion: reduce) {
    * { scroll-behavior: auto !important; }
  }

  /* --- Mobile refinement (Pass 4) --- */
  @media (max-width: 640px) {
    section { padding: 2.5rem 1rem; }

    /* Logo scaled back so it and the phone pill still fit a 320px bar */
    :root { --header-height: 74px; }
    .site-header { padding: 0.6rem 0.9rem; }
    .brand-logo { height: 50px; }
    .footer-logo { height: 64px; }

    #hero { padding-top: 3rem; padding-bottom: 3rem; }
    #hero-heading { max-width: 100%; }

    /* Grid minimums pulled in so 320px-wide devices (iPhone SE) never overflow */
    .services-list { grid-template-columns: 1fr; }
    #testimonials-list { grid-template-columns: 1fr; }
    .carousel { --per-view: 1.15; } /* one slide plus a peek at the next */

    #contact-form { max-width: 100%; }
    #contact-form input, #contact-form textarea, #contact-form button {
      min-height: 44px; /* form fields need the same tap-target floor as buttons */
      font-size: 16px; /* iOS zooms in on inputs below 16px — this prevents that */
    }
  }

  /* The carousel is the first thing on the page that moves, so this finally
     has something to switch off: jumps instead of glides, for anyone who has
     asked their OS to reduce motion. Native touch scrolling is unaffected. */
  @media (prefers-reduced-motion: reduce) {
    .carousel-viewport { scroll-behavior: auto; }
    .carousel-dot::before { transition: none; }
  }

  /* --- Print ---
     Someone printing this for a community noticeboard currently gets a dark
     hero, two black bars and a form they can't fill in. This strips it back to
     the bit that's useful on paper: who, what, when, where, phone. */
  @media print {
    :root { --color-bg: #fff; --color-bg-alt: #fff; }
    body { padding-top: 0; background: #fff; color: #000; }
    section { padding: 1rem 0; break-inside: avoid; }

    /* The bars are dark by design on screen; on paper that's a full ink wash. */
    .site-header, footer {
      position: static;
      background: #fff !important;
      border-bottom: 1px solid #000;
    }
    footer { border-top: 1px solid #000; border-bottom: none; }
    footer p, .phone-link { color: #000 !important; background: #fff !important; }
    /* The logo is a photo of a dark sign, so it prints as a small dark tile
       with the wordmark reversed out. Left as-is deliberately — inverting it
       turns the gold wreath blue, which looks worse than the ink it saves. */

    /* Hero photo is a large dark rectangle in print. Drop it and the scrim. */
    #hero { background-image: none !important; padding: 1rem 0; }
    #hero::before { display: none !important; }
    html[data-hero-image] #hero-heading,
    html[data-hero-image] .trade-icon { color: #000 !important; }
    .hero-hours { border-color: #000 !important; color: #000 !important; background: transparent !important; }

    /* Nothing here works on paper: a submit button, decorative photos, and a
       skip link that only exists for keyboard users. */
    #contact-form, #gallery, .skip-link, .cta { display: none !important; }

    /* A printed link is a dead end unless the URL comes with it — but only
       where the URL is short enough to be typed. The Google reviews deep link
       is a 300-character monster, so that one gets a readable label instead. */
    .services-note a::after { content: " (" attr(href) ")"; font-size: 0.8em; word-break: break-all; }
    .reviews-link::after { content: " — search “Mimi's Pit Stop” on Google"; }

    .services-list li, .testimonial {
      border: 1px solid #000;
      background: #fff;
      break-inside: avoid;
    }
  }
</style>
</head>
<body>

<a class="skip-link" href="#main">Skip to content</a>

<header class="site-header">
  <img class="brand-logo" data-field="logo" alt="">
  <a class="phone-link" data-field="phone" href="#"></a>
</header>

<main id="main">

  <section id="hero">
    <div class="trade-icon" id="trade-icon" aria-hidden="true"></div>
    <h1 id="hero-heading"></h1>
    <a class="cta" id="hero-cta" href="#"></a>
    <p class="hero-hours" data-field="hours"></p>
  </section>

  <section id="services">
    <span class="eyebrow">What we do</span>
    <h2 id="services-heading"></h2>
    <p class="services-note" id="services-note" hidden></p>
    <ul class="services-list" id="services-list"></ul>
  </section>

  <section id="testimonials">
    <span class="eyebrow">Loved locally</span>
    <h2 id="testimonials-heading"></h2>
    <div id="testimonials-list"></div>
    <a class="reviews-link" data-field="moreReviews" href="#" target="_blank" rel="noopener noreferrer"></a>
  </section>

  <section id="gallery">
    <span class="eyebrow">Down at the van</span>
    <h2 id="gallery-heading"></h2>
    <div class="carousel">
      <!-- tabindex makes the scroller reachable by keyboard; without it a
           keyboard user can focus the buttons but never the photos. -->
      <div class="carousel-viewport" id="gallery-grid" tabindex="0" role="group"
           aria-roledescription="carousel" aria-label="Photos from the van"></div>
      <!-- Hidden by script when everything already fits without scrolling. -->
      <div class="carousel-nav" id="gallery-nav">
        <button type="button" class="carousel-btn" id="gallery-prev" aria-label="Previous photo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 5 8 12l7 7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="carousel-dots" id="gallery-dots"></div>
        <button type="button" class="carousel-btn" id="gallery-next" aria-label="Next photo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m9 5 7 7-7 7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>
  </section>

  <section id="contact">
    <span class="eyebrow">Say hello</span>
    <h2 id="contact-heading"></h2>
    <p class="location-note" id="location-note" hidden></p>
    <form id="contact-form">
      <!-- autocomplete tokens let phones fill these from the contact card.
           Most visitors here are on a phone, so this is the difference between
           four taps and twenty. -->
      <label>Name
        <input type="text" name="name" autocomplete="name" required>
      </label>
      <label>Phone
        <input type="tel" name="phone" autocomplete="tel" required>
      </label>
      <label>Email
        <input type="email" name="email" autocomplete="email" required>
      </label>
      <label>Message
        <textarea name="message" autocomplete="off" required></textarea>
      </label>
      <!-- Web3Forms treats a filled "botcheck" as spam and silently drops it.
           Offscreen rather than display:none, and out of the tab order and the
           accessibility tree, so only a bot ever reaches it. -->
      <div class="hp-field" aria-hidden="true">
        <label>Leave this field empty
          <input type="checkbox" name="botcheck" tabindex="-1" autocomplete="off">
        </label>
      </div>
      <button type="submit" class="cta"></button>
    </form>
    <!-- The success/error message replaces the form contents. Without a live
         region a screen reader gets no announcement that anything happened. -->
    <div id="form-status" role="status" aria-live="polite"></div>
  </section>

</main>

<footer>
  <img class="footer-logo" data-field="logo" alt="">
  <p><span data-field="phone"></span> · <span data-field="address"></span></p>
  <p class="footer-hours" data-field="hours"></p>
</footer>

<script>
// script.js — takes content.js and renders it into the page.
// Runs at the bottom of <body>, after every element it targets already
// exists in the DOM, so no DOMContentLoaded listener needed.

// --- Text content ---
document.querySelectorAll('[data-field="businessName"]').forEach(el => {
  el.textContent = content.businessName;
});
document.querySelectorAll('[data-field="phone"]').forEach(el => {
  el.textContent = content.phone;
  if (el.tagName === "A") el.href = content.phoneHref;
});
document.querySelectorAll('[data-field="address"]').forEach(el => {
  el.textContent = content.address;
});
document.querySelectorAll('[data-field="hours"]').forEach(el => {
  el.textContent = content.hours;
});
// Logo stands in for the business name in the header and the footer, so its alt
// text has to carry the name — it's the only place the name is announced there.
document.querySelectorAll('[data-field="logo"]').forEach(el => {
  el.src = content.logo.src;
  el.alt = content.logo.alt;
});

// --- Trade icon (the signature element — swaps automatically per client,
// no design-system changes needed on reskin) ---
const TRADE_ICONS = {
  plumb: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4v6a2 2 0 0 0 2 2h4v8M14 20V10h4a2 2 0 0 0 2-2V4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  electric: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z"/></svg>',

  const div = document.createElement("div");

  // The label always exists; a photo, when there is one, covers it. That way a
  // dead image URL degrades to the labelled placeholder tile instead of a
  // broken image, and entries with no src still work as before.
  div.textContent = photo.alt;
  if (photo.src) {
    const img = document.createElement("img");
    img.src = photo.src;
    img.alt = photo.alt;
    img.loading = "lazy";
    // Intrinsic size of this particular photo. The .gallery-item aspect-ratio
    // already reserves the box, so this is belt-and-braces against layout shift
    // if that rule is ever changed or unsupported.
    if (photo.w) img.width = photo.w;
    if (photo.h) img.height = photo.h;
    img.decoding = "async";
    // Reverting the class too, so a failed photo goes back to looking like the
    // dashed placeholder it is rather than a solid-bordered empty tile.
    img.addEventListener("error", () => {
      img.remove();
      div.classList.remove("has-photo");
    });
    div.appendChild(img);
    div.classList.add("has-photo");
  }
  galleryGrid.appendChild(div);
});

// --- Gallery carousel behaviour ---
// The scrolling itself is entirely the browser's: every control below just
// picks a target and calls scrollTo(), so the motion is native (and stays
// smooth under load) rather than being animated frame by frame in JS.
(function galleryCarousel() {
  const viewport = galleryGrid;
  const nav = document.getElementById("gallery-nav");
  const dotsWrap = document.getElementById("gallery-dots");
  const prevBtn = document.getElementById("gallery-prev");
  const nextBtn = document.getElementById("gallery-next");
  const slides = Array.from(viewport.children);
  if (!slides.length) { nav.hidden = true; return; }

  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)");
  const scrollTo = left =>
    viewport.scrollTo({ left, behavior: reduced.matches ? "auto" : "smooth" });

  // Offset of a slide within the scroller, independent of where the scroller
  // sits on the page.
  const offsetOf = slide => slide.offsetLeft - viewport.offsetLeft;
  const maxScroll = () => viewport.scrollWidth - viewport.clientWidth;

  function currentIndex() {
    // At the far end, the last slide is showing even though its left edge
    // never reaches the scroll position — otherwise the final dot could never
    // light up whenever more than one slide is visible at a time.
    if (maxScroll() > 0 && viewport.scrollLeft >= maxScroll() - 1) return slides.length - 1;
    let best = 0, bestDist = Infinity;
    slides.forEach((slide, i) => {
      const dist = Math.abs(offsetOf(slide) - viewport.scrollLeft);
      if (dist < bestDist) { bestDist = dist; best = i; }
    });
    return best;
  }

  const goTo = i => scrollTo(offsetOf(slides[Math.max(0, Math.min(slides.length - 1, i))]));

  // Paging steps between snap offsets rather than between slide indexes.
  // Those are not the same thing: with a fractional --per-view the last slides
  // share one scroll position, so the final slide is visible long before its
  // own start offset is reachable. Stepping by index from there asks for an
  // offset past the end, the browser clamps it to where we already are, and
  // the button appears dead. Stepping by offset can't get into that state.
  function step(dir) {
    const offsets = slides.map(offsetOf);
    const x = viewport.scrollLeft;
    const target = dir > 0
      ? offsets.find(o => o > x + 1)
      : offsets.slice().reverse().find(o => o < x - 1);
    if (target !== undefined) scrollTo(target);
  }

  const dots = slides.map((slide, i) => {
    const dot = document.createElement("button");
    dot.type = "button";
    dot.className = "carousel-dot";
    dot.setAttribute("aria-label", `Show photo ${i + 1} of ${slides.length}`);
    dot.addEventListener("click", () => goTo(i));
    dotsWrap.appendChild(dot);
    return dot;
  });

  prevBtn.addEventListener("click", () => step(-1));
  nextBtn.addEventListener("click", () => step(1));

  // Arrow keys would scroll the container by a few pixels by default; snapping
  // slide to slide is what someone pressing them actually means.
  viewport.addEventListener("keydown", e => {
    if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
    e.preventDefault();
    step(e.key === "ArrowRight" ? 1 : -1);
  });

  function update() {
    const i = currentIndex();
    dots.forEach((dot, n) => dot.setAttribute("aria-current", n === i ? "true" : "false"));
    // Driven by scroll position, not index: with a fractional --per-view the
    // last slide is reached before its index is.
    prevBtn.disabled = viewport.scrollLeft <= 1;
    nextBtn.disabled = viewport.scrollLeft >= maxScroll() - 1;
    // Nothing to page through if it all fits — e.g. a client with two photos
    // on a wide screen.
    nav.hidden = maxScroll() <= 1;
  }

  let queued = false;
  viewport.addEventListener("scroll", () => {
    if (queued) return;
    queued = true;
    requestAnimationFrame(() => { queued = false; update(); });
  }, { passive: true });
  addEventListener("resize", update);
  update();
})();

// --- Structured data (JSON-LD) ---
// Hands Google the hours, phone, address and coordinates as machine-readable
// facts instead of leaving it to infer them from the prose. This is what feeds
// the map pin and the "Open ⋅ Closes 1pm" line in a local search result.
//
// Built here rather than hardcoded in the markup for two reasons: every value
// already lives in content.js (so a reskin can't leave stale data behind), and
// absolute URLs need the real origin, which is only knowable at runtime.
// Google renders JavaScript before parsing structured data, so this is read.
(function structuredData() {
  const { geo, addressParts: a, openingHours, businessName, metaDescription } = content;
  if (!a) return; // optional — a client without these fields just gets no JSON-LD

  const data = {
    "@context": "https://schema.org",
    "@type": "CafeOrCoffeeShop",
    name: businessName,
    description: metaDescription,
    telephone: content.phoneHref.replace(/^tel:/, ""),
    priceRange: content.priceRange,
    servesCuisine: ["Coffee", "Tea", "Smoothies", "Baked goods"],
    address: {
      "@type": "PostalAddress",
      streetAddress: a.street,
      addressLocality: a.locality,
      addressRegion: a.region,
      postalCode: a.postcode,
      addressCountry: a.country
    },
    sameAs: [FACEBOOK_URL, content.moreReviews && content.moreReviews.url].filter(Boolean)
  };

  if (geo) {
    data.geo = { "@type": "GeoCoordinates", latitude: geo.lat, longitude: geo.lng };
  }
  if (openingHours) {
    data.openingHoursSpecification = openingHours.map(h => ({
      "@type": "OpeningHoursSpecification",
      dayOfWeek: h.days,
      opens: h.opens,
      closes: h.closes
    }));
  }
  // Only meaningful once the page is served over http(s) — on file:// these
  // resolve to file paths, which would be worse than omitting them.
  if (location.origin && location.origin !== "null") {
    data.url = new URL("/", location.href).href;
    data.image = new URL("og-image.jpg", location.href).href;
  }

  const el = document.createElement("script");
  el.type = "application/ld+json";
  el.textContent = JSON.stringify(data);
  document.head.appendChild(el);
})();

// --- Web3Forms submit handler ---
const form = document.getElementById("contact-form");
const formStatus = document.getElementById("form-status");

form.addEventListener("submit", async function (e) {
  e.preventDefault();

  const submitBtn = form.querySelector('button[type="submit"]');
  const originalBtnText = submitBtn.textContent;
  submitBtn.textContent = "Sending...";
  submitBtn.disabled = true;

  const formData = new FormData(form);
  formData.append("access_key", content.web3formsKey);
  // Names the email so it's identifiable in the inbox and less likely to be
  // filtered. Web3Forms treats both as special fields.
  formData.append("subject", `New enquiry from the ${content.businessName} website`);
  formData.append("from_name", content.businessName);

  try {
    const response = await fetch("https://api.web3forms.com/submit", {
      method: "POST",
      body: formData
    });
    const result = await response.json().catch(() => ({}));

    if (response.ok && result.success) {
      // Hide the form rather than blowing away its contents, and put the
      // message in the live region so it's announced instead of silently
      // swapped in. Replacing innerHTML moved focus nowhere and said nothing.
      form.hidden = true;
      formStatus.className = "form-success";
      formStatus.textContent = "Thanks so much — we've got your message and we'll call you back shortly!";
    } else {
      // Surface what the API actually said. Without this the visitor-facing
      // message is the only signal, which makes a dead key indistinguishable
      // from a network drop when you're trying to debug it.
      console.error("Web3Forms rejected the submission:", response.status, result);
      throw new Error(result.message || `HTTP ${response.status}`);
    }
  } catch (err) {
    console.error("Web3Forms submission failed:", err);
    submitBtn.textContent = originalBtnText;
    submitBtn.disabled = false;
    formStatus.className = "form-error";
    formStatus.textContent = "Oh no, that didn't send — please give us a call instead and we'll sort you out!";
  }
});
</script>
