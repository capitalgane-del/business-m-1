<script>
  // Sets title, description, brand colours and structured data before first paint.
  (function () {
    const c = content, root = document.documentElement;
    const staticTitle = document.title;
    const staticDesc = document.querySelector('meta[name="description"]').getAttribute("content");
    if (staticTitle !== c.pageTitle || staticDesc !== c.metaDescription) {
      console.warn("The static <title>/description in <head> differ from content. Link previews read the static ones: update them.");
    }
    document.title = c.pageTitle;
    document.querySelector('meta[name="description"]').setAttribute("content", c.metaDescription);
    document.querySelector('meta[name="theme-color"]').setAttribute("content", c.colours.primary);
    const vars = { "--color-primary": "primary", "--on-primary": "onPrimary", "--dark": "dark", "--accent": "accent", "--on-accent": "onAccent" };
    Object.entries(vars).forEach(([k, v]) => { if (c.colours[v]) root.style.setProperty(k, c.colours[v]); });
    if (c.heroImage) {
      root.style.setProperty("--hero-image", 'url("' + c.heroImage + '")');
      root.setAttribute("data-hero-image", "true");
    }

    // MovingCompany JSON-LD, built from content so it never drifts. Empty fields are dropped.
    const s = c.schema || {};
    const prune = o => {
      Object.keys(o).forEach(k => {
        const v = o[k];
        if (v && typeof v === "object" && !Array.isArray(v)) prune(v);
        if (v == null || v === "" || (Array.isArray(v) && !v.length)) delete o[k];
      });
      return o;
    };
    const ld = prune({
      "@context": "https://schema.org",
      "@type": "MovingCompany",
      name: c.businessName,
      url: c.siteUrl,
      description: c.metaDescription,
      telephone: s.telephone,
      email: c.email,
      logo: s.logo,
      image: s.image,
      address: {
        "@type": "PostalAddress", streetAddress: s.streetAddress, addressLocality: s.locality,
        addressRegion: s.region, postalCode: s.postcode, addressCountry: "AU"
      },
      areaServed: s.areaServed,
      openingHours: s.openingHours,
      priceRange: s.priceRange,
      sameAs: (c.links || []).map(l => l.href),
      hasOfferCatalog: (c.services || []).length ? {
        "@type": "OfferCatalog", name: "Services",
        itemListElement: c.services.map(sv => ({ "@type": "Offer", itemOffered: { "@type": "Service", name: sv.name } }))
      } : null
    });
    const tag = document.createElement("script");
    tag.type = "application/ld+json";
    tag.textContent = JSON.stringify(ld);
    document.head.append(tag);
    const empty = Object.keys(s).filter(k => !s[k]);
    if (empty.length) console.info("JSON-LD placeholders still empty: " + empty.join(", "));
  })();
</script>

<style>
  /* Design read: removalist lead-gen site for people mid-move, on their phone, comparing quotes.
     Trust-first, call and quote always one tap away. Static HTML + CSS variables + Phosphor icons.
     One radius, one accent (the call colour), light or dark follows the visitor's device. */
  :root {
    --color-primary: #14365A;
    --on-primary: #FFFFFF;
    --dark: #0B1E33;
    --accent: #F5A524;
    --on-accent: #13171C;

    --bg: #F4F6F9;
    --surface: #FFFFFF;
    --ink: #111A26;
    --muted: #4A5666;
    --border: rgba(17, 26, 38, 0.12);
    --field: #FFFFFF;
    --field-border: rgba(17, 26, 38, 0.55);
    --band: color-mix(in srgb, var(--color-primary) 6%, var(--bg));
    --primary-text: var(--color-primary);
    --tile: color-mix(in srgb, var(--color-primary) 9%, var(--surface));

    --font: "Outfit", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --r: 12px;
    --max: 1200px;
    --header-h: 64px;
    --hero-image: none;
  }

    :root {
      --bg: #0B1520;
      --surface: #122131;
      --ink: #E8EEF5;
      --muted: #A9B6C5;
      --border: rgba(232, 238, 245, 0.14);
      --field: #0B1520;
      --field-border: rgba(232, 238, 245, 0.45);
      --band: color-mix(in srgb, var(--color-primary) 22%, var(--bg));
      --primary-text: color-mix(in srgb, var(--color-primary) 30%, #FFFFFF);
      --tile: color-mix(in srgb, var(--color-primary) 45%, var(--surface));
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  @media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
  body {
    font-family: var(--font);
    font-size: 1.0625rem;
    line-height: 1.55;
    color: var(--ink);
    background: var(--bg);
  }
  img { max-width: 100%; display: block; }
  a { color: inherit; text-decoration: none; }
  ul, ol { list-style: none; }
  /* Reserve icon space so nothing shifts when the icon font arrives. */
  i[class^="ph"] { display: inline-block; width: 1em; height: 1em; line-height: 1; flex-shrink: 0; }

  h1, h2, h3 { font-weight: 800; letter-spacing: -0.03em; line-height: 1.05; overflow-wrap: break-word; }
  h2 { font-size: clamp(2rem, 5vw, 3.3rem); }
  h3 { font-size: 1.25rem; letter-spacing: -0.015em; line-height: 1.2; }

  :focus-visible { outline: 3px solid var(--primary-text); outline-offset: 3px; }

  .wrap { max-width: var(--max); margin: 0 auto; }
  .sec { padding: clamp(3.5rem, 8vw, 6.5rem) 1.25rem; }
  .sec-head { margin-bottom: clamp(1.75rem, 4vw, 3rem); }
  .sec-head p { margin-top: 0.85rem; color: var(--muted); font-size: 1.15rem; max-width: 52ch; }
  section[id] { scroll-margin-top: var(--header-h); }

  .skip-link { position: absolute; left: 0.75rem; top: -100px; z-index: 100; padding: 0.75rem 1rem; border-radius: var(--r); background: var(--accent); color: var(--on-accent); font-weight: 700; }
  .skip-link:focus { top: 0.75rem; }

  /* ---------- Buttons ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 0.6rem;
    min-height: 56px; padding: 0.9rem 1.6rem;
    font-family: var(--font); font-size: 1.1rem; font-weight: 700; white-space: nowrap;
    border-radius: var(--r); border: 0; cursor: pointer;
    transition: transform 0.15s ease, filter 0.15s ease, background-color 0.15s ease;
  }
  .btn:active { transform: translateY(1px) scale(0.98); }
  .btn-accent { background: var(--accent); color: var(--on-accent); }
  .btn-accent:hover { filter: brightness(1.06); }
  .btn-primary { background: var(--color-primary); color: var(--on-primary); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.16); }
  .btn-primary:hover { filter: brightness(1.15); }
  @media (prefers-color-scheme: dark) { .btn-primary { box-shadow: inset 0 0 0 2px var(--primary-text); } }
  .btn-ghost { background: rgba(255, 255, 255, 0.06); color: #FFFFFF; box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.7); }
  .btn-ghost:hover { background: rgba(255, 255, 255, 0.14); }

  /* ---------- Preview strip ---------- */

  .brand-name { font-weight: 800; font-size: 1.2rem; letter-spacing: -0.02em; white-space: nowrap; }
  .brand-sub { font-size: 0.78rem; font-weight: 500; color: var(--muted); white-space: nowrap; }
  .brand-logo { height: 44px; width: auto; }
  .nav { display: none; gap: 1.75rem; font-weight: 500; }
  .nav a { color: var(--muted); }
  .nav a:hover { color: var(--ink); }
  @media (min-width: 960px) { .nav { display: flex; } }
  .header-cta { min-height: 46px; padding: 0.5rem 1rem; font-size: 1rem; flex-shrink: 0; }
  .cta-short { display: none; }
  @media (max-width: 400px) { .cta-long { display: none; } .cta-short { display: inline; } }

  /* ---------- Hero ---------- */
  .hero {
    position: relative; isolation: isolate; color: #FFFFFF; overflow: hidden;
    padding: clamp(2rem, 6vw, 5rem) 1.25rem clamp(2rem, 5vw, 4rem);
    background:
      radial-gradient(90% 70% at 85% 15%, color-mix(in srgb, var(--color-primary) 70%, #FFFFFF 18%) 0%, transparent 65%),
      linear-gradient(160deg, var(--color-primary) 0%, var(--dark) 100%);
  }
  html[data-hero-image] .hero { min-height: min(80dvh, 760px); display: flex; align-items: center; background: var(--hero-image) center / cover, var(--dark); }
  html[data-hero-image] .hero::before {
    content: ""; position: absolute; inset: 0; z-index: -1;
    background: linear-gradient(90deg, rgba(6, 14, 24, 0.86) 0%, rgba(6, 14, 24, 0.6) 55%, rgba(6, 14, 24, 0.3) 100%);
  }
  .hero .wrap { width: 100%; }
  .hero-grid { display: grid; gap: 1.75rem; align-items: center; }
  @media (min-width: 900px) { .hero-grid { grid-template-columns: 1.15fr 1fr; gap: 3rem; } }
  .eyebrow { display: inline-flex; align-items: center; gap: 0.45rem; font-weight: 600; font-size: 0.98rem; color: var(--accent); margin-bottom: 0.9rem; }
  .hero h1 { font-size: clamp(2.5rem, 7.2vw, 4.6rem); max-width: 14ch; letter-spacing: -0.04em; }
  @media (min-width: 900px) { .hero h1 { font-size: clamp(3rem, 5.1vw, 4.1rem); max-width: 16ch; } }
  .hero-sub { margin-top: 1rem; font-size: clamp(1.12rem, 2.1vw, 1.4rem); max-width: 34ch; color: rgba(255, 255, 255, 0.9); line-height: 1.4; }
  .hero-actions { margin-top: 1.75rem; display: flex; flex-wrap: wrap; gap: 0.75rem; }
  @media (max-width: 480px) { .hero-actions .btn { width: 100%; } }
  .hero-text { margin-top: 1rem; color: rgba(255, 255, 255, 0.85); font-size: 1rem; }
  .hero-text a { color: #FFFFFF; font-weight: 700; text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  .hero-visual img { width: 100%; max-width: 640px; height: auto; margin: 0 auto; }
  .hero :focus-visible { outline-color: #FFFFFF; }

  /* ---------- Facts bar ---------- */
  .facts { background: var(--surface); border-bottom: 1px solid var(--border); padding: 1.75rem 1.25rem; }
  .facts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.4rem 1rem; }
  @media (min-width: 900px) { .facts-grid { grid-template-columns: repeat(4, 1fr); gap: 1.5rem; } }
  .fact { display: flex; gap: 0.75rem; align-items: flex-start; }
  .fact > i { font-size: 1.35rem; padding: 0.5rem; box-sizing: content-box; border-radius: 10px; background: var(--tile); color: var(--primary-text); }
  .fact-value { font-weight: 700; font-size: 1.05rem; line-height: 1.2; letter-spacing: -0.01em; }
  .fact-label { font-size: 0.92rem; color: var(--muted); line-height: 1.35; margin-top: 0.15rem; }
  .fact a.fact-value { text-decoration: underline; text-underline-offset: 3px; }
  .stars { display: inline-flex; gap: 2px; font-size: 0.95rem; margin-top: 0.25rem; color: var(--accent); }

  /* ---------- Services ---------- */
  .svc-grid { display: grid; grid-template-columns: 1fr; gap: 0.85rem; }
  @media (min-width: 768px) {
    .svc-grid { grid-template-columns: repeat(3, 1fr); gap: 1rem; grid-auto-flow: dense; }
    .svc-card.wide { grid-column: span 2; }
  }
  .svc-card {
    display: grid; grid-template-columns: auto 1fr; gap: 0.25rem 1rem; align-items: start;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 1.25rem;
  }
  .svc-icon { grid-row: span 2; width: 52px; height: 52px; display: grid; place-items: center; border-radius: var(--r); background: var(--tile); color: var(--primary-text); font-size: 1.55rem; }
  .svc-card p { color: var(--muted); font-size: 1rem; line-height: 1.45; }
  .svc-photo { grid-column: 1 / -1; width: 100%; aspect-ratio: 16 / 10; object-fit: cover; border-radius: calc(var(--r) - 4px); margin-bottom: 0.75rem; }
  @media (min-width: 768px) {
    .svc-card { grid-template-columns: 1fr; padding: 1.5rem; }
    .svc-icon { grid-row: auto; margin-bottom: 1rem; }
  }
  .svc-cta { background: var(--color-primary); color: var(--on-primary); border-color: transparent; display: flex; flex-direction: column; justify-content: center; gap: 0.35rem; }
  .svc-cta p { color: var(--on-primary); opacity: 0.92; }
  .svc-cta .btn { margin-top: 0.85rem; align-self: flex-start; min-height: 50px; padding: 0.6rem 1.2rem; font-size: 1rem; }
  .svc-cta :focus-visible { outline-color: #FFFFFF; }
  @media (max-width: 480px) { .svc-cta .btn { align-self: stretch; } }

  /* ---------- Storage feature ---------- */
  #storage { background: var(--band); }
  .feature { display: grid; gap: 2rem; align-items: center; }
  @media (min-width: 900px) { .feature { grid-template-columns: 1fr 1fr; gap: 4rem; } }
  .feature-media { background: var(--surface); border-radius: var(--r); padding: clamp(1rem, 3vw, 2rem); }
  .feature-media img { width: 100%; height: auto; }
  .feature-body p { margin-top: 1rem; color: var(--muted); font-size: 1.15rem; max-width: 44ch; }
  .feature-body .btn { margin-top: 1.75rem; }
  @media (max-width: 480px) { .feature-body .btn { width: 100%; } }

  /* ---------- Work (shown once real photos are in) ---------- */
  #work { background: var(--band); }
  .ba-grid { display: grid; gap: 1.5rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); }
  .ba-stage { position: relative; aspect-ratio: 4 / 3; overflow: hidden; border-radius: var(--r); --pos: 50%; background: var(--surface); }
  .ba-stage img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .ba-before { clip-path: inset(0 calc(100% - var(--pos)) 0 0); }
  .ba-line { position: absolute; top: 0; bottom: 0; left: var(--pos); width: 3px; background: #F6F6F3; transform: translateX(-50%); pointer-events: none; }
  .ba-knob {
    position: absolute; top: 50%; left: var(--pos); transform: translate(-50%, -50%);
    width: 48px; height: 48px; border-radius: var(--r); background: #F6F6F3; color: #15191C;
    display: grid; place-items: center; font-size: 1.4rem; pointer-events: none;
  }
  .ba-stage input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: ew-resize; margin: 0; }
  .ba-stage:has(input:focus-visible) { outline: 3px solid var(--primary-text); outline-offset: 3px; }
  .ba-caption { display: flex; justify-content: space-between; gap: 1rem; margin-top: 0.75rem; font-weight: 600; }
  .ba-caption span:nth-child(2) { color: var(--muted); font-weight: 500; text-align: center; }
  .gallery { margin-top: 3rem; columns: 2; column-gap: 1rem; }
  @media (min-width: 768px) { .gallery { columns: 3; } }
  .gallery img { width: 100%; margin-bottom: 1rem; border-radius: var(--r); break-inside: avoid; }

  /* ---------- Reviews (shown once real reviews are in) ---------- */
  .rev { display: grid; gap: 1.25rem; }
  @media (min-width: 900px) { .rev { grid-template-columns: 5fr 7fr; } }
  .rev-feature {
    background: var(--color-primary); color: var(--on-primary); border-radius: var(--r);
    padding: clamp(1.75rem, 4vw, 2.75rem); display: flex; flex-direction: column; justify-content: space-between; gap: 2rem;
  }
  .rev-feature blockquote { font-size: clamp(1.35rem, 2.6vw, 1.9rem); font-weight: 600; line-height: 1.3; letter-spacing: -0.01em; }
  .rev-list { display: grid; gap: 1rem; align-content: start; }
  .rev-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 1.5rem; }
  .rev-card blockquote { font-size: 1.1rem; margin: 0.6rem 0 1rem; }
  .rev-author { font-weight: 700; }
  .rev-meta { font-size: 0.95rem; color: var(--muted); }
  .rev-meta a { text-decoration: underline; text-underline-offset: 3px; }
  .rev-feature .rev-meta { color: var(--on-primary); }

  /* ---------- Process ---------- */
  .proc { display: grid; gap: 2rem; }
  @media (min-width: 900px) { .proc { grid-template-columns: 5fr 7fr; align-items: start; } }
  .step { display: grid; grid-template-columns: 56px 1fr; gap: 1rem; padding: 1.3rem 0; border-top: 1px solid var(--border); }
  .step:first-child { border-top: 0; padding-top: 0; }
  .step-icon { position: relative; width: 56px; height: 56px; border-radius: var(--r); background: var(--color-primary); color: var(--on-primary); display: grid; place-items: center; font-size: 1.5rem; }
  .step-num { position: absolute; top: -8px; right: -8px; width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: var(--on-accent); font-size: 0.8rem; font-weight: 800; display: grid; place-items: center; }
  .step p { color: var(--muted); margin-top: 0.3rem; }

  /* ---------- Quote / contact ---------- */
  #quote { background: linear-gradient(160deg, var(--color-primary) 0%, var(--dark) 100%); color: var(--on-primary); }
  .contact-grid { display: grid; gap: 2rem; }
  @media (min-width: 900px) {
    .contact-grid { grid-template-columns: 5fr 6fr; align-items: start; gap: 4rem; }
    .contact-grid > div:first-child { position: sticky; top: calc(var(--header-h) + 2rem); }
  }
  .contact-sub { margin-top: 1rem; font-size: 1.15rem; opacity: 0.92; max-width: 40ch; }
  .promises { margin-top: 1.5rem; display: grid; gap: 0.7rem; }
  .promises li { display: flex; gap: 0.7rem; align-items: center; font-size: 1.1rem; font-weight: 500; }
  .promises i { font-size: 1.4rem; color: var(--accent); }
  .big-phone { display: inline-flex; align-items: center; gap: 0.7rem; margin-top: 1.75rem; font-size: clamp(1.8rem, 4.5vw, 2.6rem); font-weight: 800; letter-spacing: -0.03em; }
  .big-phone i { color: var(--accent); }
  .contact-alt { margin-top: 0.6rem; display: flex; flex-wrap: wrap; gap: 0.4rem 1.25rem; font-weight: 600; }
  .contact-alt a { display: inline-flex; align-items: center; gap: 0.45rem; min-height: 40px; text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 4px; overflow-wrap: anywhere; }
  #quote :focus-visible { outline-color: #FFFFFF; }
  #quote .form-card :focus-visible { outline-color: var(--primary-text); }

  .form-card { scroll-margin-top: calc(var(--header-h) + 0.75rem); background: var(--surface); color: var(--ink); border-radius: var(--r); padding: clamp(1.25rem, 3vw, 2.25rem); box-shadow: 0 30px 60px -30px rgba(0, 0, 0, 0.55); }
  .form-title { font-size: 1.35rem; margin-bottom: 0.25rem; }
  .form-req { font-size: 0.95rem; color: var(--muted); margin-bottom: 1.1rem; }
  #quote-form { display: grid; gap: 1rem; }
  .form-row { display: grid; gap: 1rem; }
  @media (min-width: 520px) { .form-row { grid-template-columns: 1fr 1fr; } }
  .field { display: grid; gap: 0.4rem; font-weight: 600; font-size: 0.98rem; min-width: 0; }
  .opt { font-weight: 400; color: var(--muted); }
  #quote-form input:not([type="radio"]):not([type="checkbox"]), #quote-form select, #quote-form textarea {
    width: 100%; min-width: 0; font-family: var(--font); font-size: 1rem; color: var(--ink); background-color: var(--field);
    min-height: 52px; padding: 0.75rem 0.9rem; border: 1.5px solid var(--field-border); border-radius: var(--r);
    -webkit-appearance: none; appearance: none;
  }
  #quote-form input::placeholder, #quote-form textarea::placeholder { color: var(--muted); opacity: 0.85; }
  #quote-form input::-webkit-date-and-time-value { text-align: left; }
  #quote-form select {
    padding-right: 2.5rem; cursor: pointer;
    background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
    background-position: calc(100% - 20px) 52%, calc(100% - 14px) 52%;
    background-size: 6px 6px; background-repeat: no-repeat;
  }
  #quote-form textarea { min-height: 104px; resize: vertical; }
  #quote-form :is(input, select, textarea):focus-visible { outline: 3px solid var(--primary-text); outline-offset: 1px; border-color: var(--primary-text); }
  .choice { border: 0; min-width: 0; }
  .choice legend { font-weight: 600; font-size: 0.98rem; margin-bottom: 0.45rem; padding: 0; }
  .choice-opts { display: flex; flex-wrap: wrap; gap: 0.5rem; }
  .choice-opt { display: inline-flex; align-items: center; gap: 0.55rem; min-height: 46px; padding: 0.5rem 0.9rem; border: 1.5px solid var(--field-border); border-radius: var(--r); font-weight: 500; cursor: pointer; }
  .choice-opt input { width: 1.15rem; height: 1.15rem; accent-color: var(--primary-text); margin: 0; }
  .choice-opt:has(input:checked) { border-color: var(--primary-text); background: var(--tile); }
  .choice-opt:has(input:focus-visible) { outline: 3px solid var(--primary-text); outline-offset: 2px; }
  #quote-form button[type="submit"] { width: 100%; margin-top: 0.25rem; }
  .form-note { font-size: 0.95rem; color: var(--muted); }
  .form-note a { color: var(--primary-text); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
  .form-success { font-size: 1.25rem; font-weight: 700; line-height: 1.35; }
  .form-msg { font-weight: 600; padding: 0.85rem 1rem; border-radius: var(--r); background: var(--tile); }
  .form-error { color: #B3261E; background: color-mix(in srgb, #B3261E 8%, var(--surface)); }
  @media (prefers-color-scheme: dark) { .form-error { color: #F2B8B5; } }
  .hp { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }

  /* ---------- FAQ ---------- */
  .faq { max-width: 820px; }
  .faq details { border-top: 1px solid var(--border); }
  .faq details:last-child { border-bottom: 1px solid var(--border); }
  .faq summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: 1.1rem 0; font-weight: 700; font-size: 1.1rem; min-height: 48px; }
  .faq summary::-webkit-details-marker { display: none; }
  .faq summary::after { content: "+"; flex-shrink: 0; font-size: 1.6rem; font-weight: 400; line-height: 1; color: var(--primary-text); transition: transform 0.2s ease; }
  .faq details[open] summary::after { transform: rotate(45deg); }
  .faq details p { padding-bottom: 1.25rem; color: var(--muted); max-width: 62ch; }

  /* ---------- Areas (shown once confirmed) ---------- */
  .areas { display: flex; flex-wrap: wrap; gap: 0.6rem; }
  .areas li { padding: 0.6rem 1.1rem; border: 1.5px solid var(--border); border-radius: var(--r); font-weight: 600; background: var(--surface); }

  /* ---------- Footer ---------- */
  /* Extra bottom padding on phones so the fixed call bar never covers the last line. */
  footer { background: #07111D; color: #E6ECF3; padding: 3rem 1.25rem calc(2rem + 76px + env(safe-area-inset-bottom)); }
  @media (min-width: 768px) { footer { padding-bottom: 2rem; } }
  .foot { display: grid; gap: 2rem; }
  @media (min-width: 768px) { .foot { grid-template-columns: 1.4fr 1fr 1fr; } }
  .foot h3 { font-size: 1.15rem; margin-bottom: 0.6rem; }
  .foot p, .foot a { color: #B4C0CE; }
  .foot a { display: inline-flex; align-items: center; gap: 0.5rem; min-height: 36px; }
  .foot a:hover { color: #FFFFFF; }
  .foot-list { display: grid; gap: 0.15rem; justify-items: start; }
  .foot-list a { overflow-wrap: anywhere; }
  footer :focus-visible { outline-color: #FFFFFF; }
  .foot-base { margin-top: 2.5rem; padding-top: 1.25rem; border-top: 1px solid rgba(230, 236, 243, 0.14); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0.5rem 1.5rem; font-size: 0.88rem; color: #93A1B2; }

  /* ---------- Hover pop (mouse only, never on touch or reduced motion) ---------- */
  @media (hover: hover) and (pointer: fine) and (prefers-reduced-motion: no-preference) {
    .btn, .svc-card, .step-icon {
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.2s ease,
                  background-color 0.15s ease, filter 0.15s ease;
    }
    .btn:hover { transform: translateY(-2px); }
    .btn:active { transform: translateY(0) scale(0.98); }
    .svc-card:hover { transform: translateY(-4px); box-shadow: 0 18px 32px -16px color-mix(in srgb, var(--color-primary) 55%, transparent); }
    .step:hover .step-icon { transform: scale(1.06); }
  }

  /* ---------- Motion ----------
     Hero and form are never hidden or delayed: the hero text paints immediately and the truck
     only slides a few pixels. Everything else gets one short fade-up as it scrolls into view.
     Skipped for reduced motion. Content is only hidden once the script confirms it can reveal it. */
  @media (prefers-reduced-motion: no-preference) {
    @keyframes drive-in { from { transform: translateX(-18px); } to { transform: none; } }
    .hero-visual img { animation: drive-in 0.6s cubic-bezier(0.16, 1, 0.3, 1) both; }

    html.js-reveal .reveal {
      opacity: 0; transform: translateY(10px);
      transition: opacity 0.45s ease-out, transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
      transition-delay: calc(var(--i, 0) * 60ms);
    }
    html.js-reveal .reveal.in { opacity: 1; transform: none; }
  }

  /* ---------- Mobile call bar ---------- */
  .mobile-bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
    display: grid; grid-template-columns: 1.15fr 1fr; gap: 0.6rem;
    padding: 0.65rem 0.75rem calc(0.65rem + env(safe-area-inset-bottom));
    background: var(--surface); border-top: 1px solid var(--border);
    box-shadow: 0 -8px 24px -12px rgba(0, 0, 0, 0.25);
    transition: transform 0.2s ease;
  }
  .mobile-bar .btn { min-height: 52px; padding: 0.6rem 0.75rem; font-size: 1.05rem; }
  .mobile-bar .btn-quote { background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 2px var(--ink); }
  /* Out of the way while someone is typing in the form (phone keyboards push fixed bars over fields). */
  .mobile-bar.typing { transform: translateY(110%); }
  @media (min-width: 768px) { .mobile-bar { display: none; } }
</style>

<body>
<a class="skip-link" href="#quote-card">Skip to the quote form</a>
<div id="app"></div>
<noscript><p style="padding:2rem">Please enable JavaScript to view this page, or call Move Mate on 0422 394 487.</p></noscript>

<script>
// Renders content into the page. Nothing here is client-specific.
const c = content;
const app = document.getElementById("app");

function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  Object.entries(props || {}).forEach(([k, v]) => {
    if (v === false || v == null) return;
    if (k === "class") el.className = v;
    else el.setAttribute(k, v === true ? "" : v);
  });
  kids.flat(Infinity).forEach(k => { if (k != null && k !== false) el.append(k.nodeType ? k : document.createTextNode(k)); });
  return el;
}
const icon = (name, weight) => h("i", { class: (weight || "ph-bold") + " ph-" + name, "aria-hidden": "true" });
const stars = (n, label) => {
  const s = h("span", { class: "stars", role: "img", "aria-label": label || (n + " out of 5 stars") });
  for (let i = 0; i < n; i++) s.append(icon("star", "ph-fill"));
  return s;
};
const section = (id, cls, inner) => h("section", { id, class: cls }, h("div", { class: "wrap" }, inner));
const head = (title, sub) => h("div", { class: "sec-head" }, h("h2", {}, title), sub ? h("p", {}, sub) : null);
// External profiles open in a new tab so the site stays open.
const ext = (href, cls, ...kids) => h("a", { href, class: cls, target: "_blank", rel: "noopener" }, kids);

const hasWork = (c.beforeAfter && c.beforeAfter.length) || (c.gallery && c.gallery.length);
const hasReviews = c.reviews && c.reviews.length;

// ----- Preview strip -----
if (c.sample) {
  app.append(h("div", { class: "preview-strip", role: "note" }, c.sampleText));
  console.warn("content.sample is true: preview strip showing. Set it to false once the client approves the site.");
}

// ----- Header -----
const navLinks = [
  ["Services", "#services", c.services && c.services.length],
  ["Storage", "#storage", c.storage],
  ["Work", "#work", hasWork],
  ["Reviews", "#reviews", hasReviews],
  ["How it works", "#process", c.steps && c.steps.length],
  ["FAQ", "#faq", c.faqs && c.faqs.length],
  [c.quoteText, "#quote-card", true]
].filter(l => l[2]);
app.append(
  h("header", { class: "site-header" },
    h("div", { class: "wrap" },
      h("a", { class: "brand", href: "#top", "aria-label": c.businessName + ", back to top" },
        c.logo ? h("img", { class: "brand-logo", src: c.logo, alt: c.logoAlt })
               : [h("span", { class: "brand-mark" }, icon("package", "ph-fill")),
                  h("span", { class: "brand-text" }, h("span", { class: "brand-name" }, c.brandShort), h("span", { class: "brand-sub" }, c.brandSub))]
      ),
      h("nav", { class: "nav", "aria-label": "Main" }, navLinks.map(l => h("a", { href: l[1] }, l[0]))),
      h("a", { class: "btn btn-accent header-cta", href: c.phoneHref, "aria-label": "Call " + c.phone },
        icon("phone-call"), h("span", { class: "cta-long" }, c.phone), h("span", { class: "cta-short" }, "Call"))
    )
  )
);

const main = h("main", { id: "main" });
app.append(main);

// ----- Hero -----
main.append(
  h("section", { id: "top", class: "hero" },
    h("div", { class: "wrap hero-grid" },
      h("div", {},
        c.heroEyebrow ? h("p", { class: "eyebrow" }, icon("map-pin", "ph-fill"), c.heroEyebrow) : null,
        h("h1", {}, c.heroHeading),
        h("p", { class: "hero-sub" }, c.heroSub),
        h("div", { class: "hero-actions" },
          h("a", { class: "btn btn-accent", href: c.phoneHref }, icon("phone-call"), c.heroCallText || c.ctaText),
          h("a", { class: "btn btn-ghost", href: "#quote-card" }, c.quoteText, icon("arrow-right"))
        ),
        c.smsHref ? h("p", { class: "hero-text" }, c.textPrompt + " ", h("a", { href: c.smsHref }, "Text " + c.phone)) : null
      ),
      c.heroVisual && !c.heroImage ? h("div", { class: "hero-visual" },

// ----- Quote form -----
// Built from content.form.fields. Every control has a visible label; groups use fieldset + legend.
const optional = f => f.required ? null : h("span", { class: "opt" }, " (optional)");
function field(f) {
  if (f.type === "row") return h("div", { class: "form-row" }, f.fields.map(field));
  if (f.type === "radios" || f.type === "checks") {
    const radio = f.type === "radios";
    return h("fieldset", { class: "choice" },
      h("legend", {}, f.label, radio ? null : optional(f)),
      h("div", { class: "choice-opts" }, f.options.map((o, i) => h("label", { class: "choice-opt" },
        radio ? h("input", { type: "radio", name: f.name, value: o, checked: i === 0 })
              : h("input", { type: "checkbox", name: o.name, value: "Yes" }),
        h("span", {}, radio ? o : o.label)
      )))
    );
  }
  let control;
  const base = { name: f.name, id: "f-" + f.name, required: !!f.required, autocomplete: f.autocomplete };
  if (f.type === "select") {
    control = h("select", base, h("option", { value: "" }, f.placeholder || "Choose one"), f.options.map(o => h("option", {}, o)));
  } else if (f.type === "textarea") {
    control = h("textarea", Object.assign(base, { placeholder: f.placeholder, rows: "3" }));
  } else {
    control = h("input", Object.assign(base, { type: f.type, placeholder: f.placeholder }));
    if (f.type === "date") {
      const d = new Date();
      control.min = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
    }
  }
  return h("label", { class: "field", for: base.id }, h("span", {}, f.label, optional(f)), control);
}
const form = h("form", { id: "quote-form" },
  (c.form.fields || []).map(field),
  h("input", { type: "checkbox", name: "botcheck", class: "hp", tabindex: "-1", autocomplete: "off", "aria-hidden": "true" }),
  h("button", { type: "submit", class: "btn btn-primary" }, c.form.submitText),
  h("p", { class: "form-note" }, "Prefer to talk? ", h("a", { href: c.phoneHref }, "Call"),
    c.smsHref ? [" or ", h("a", { href: c.smsHref }, "text")] : null, " " + c.phone + "."),
  h("div", { class: "form-status", role: "status", "aria-live": "polite" })
);
main.append(

          c.email ? h("a", { href: "mailto:" + c.email }, icon("envelope-simple"), c.email) : null)
      ),

// ----- Scroll reveal -----
// Skipped for reduced motion or browsers without IntersectionObserver, so nothing is ever left
// invisible. The hero and the quote form are deliberately not in this list.
(function () {
  const calm = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (calm || !("IntersectionObserver" in window)) return;

  const groups = [
    ".facts-grid > .fact",
    "#services .sec-head, #process .sec-head, #faq .sec-head, #reviews .sec-head, #work .sec-head, #areas .sec-head",
    ".svc-grid > .svc-card",
    ".feature > div",
    ".ba-grid > figure",
    ".rev-feature",
    ".rev-list > .rev-card",
    ".steps > .step",
    ".faq",
    ".areas"
  ];
  const targets = [];
  groups.forEach(sel => {
    document.querySelectorAll(sel).forEach((el, i) => {
      el.classList.add("reveal");
      el.style.setProperty("--i", Math.min(i, 4)); // stagger within a group, capped
      targets.push(el);
    });
  });

  document.documentElement.classList.add("js-reveal");
  const io = new IntersectionObserver((entries) => {
    entries.forEach(en => {
      if (!en.isIntersecting) return;
      const el = en.target;
      el.classList.add("in");
      io.unobserve(el);
      // Once revealed, drop the reveal state so hover effects work without delay or conflict.
      const done = () => { el.classList.remove("reveal", "in"); el.style.removeProperty("--i"); };
      el.addEventListener("transitionend", function f(ev) {
        if (ev.target === el && ev.propertyName === "opacity") { el.removeEventListener("transitionend", f); done(); }
      });
      setTimeout(done, 1200);
    });
  }, { threshold: 0.1, rootMargin: "0px 0px -5% 0px" });
  targets.forEach(el => io.observe(el));
})();

// ----- Web3Forms submit -----
form.addEventListener("submit", async function (e) {
  e.preventDefault();
  const status = form.querySelector(".form-status");
  const say = (text, cls) => { status.replaceChildren(h("p", { class: "form-msg " + (cls || "") }, text)); };
  // Preview: no key yet, so say so plainly instead of pretending to send.
  if (!c.web3formsKey || /YOUR_|_HERE/.test(c.web3formsKey)) { say(c.form.previewNotice); return; }

  const btn = form.querySelector('button[type="submit"]');
  const original = btn.textContent;
  btn.textContent = "Sending";
  btn.disabled = true;
  const data = new FormData(form);
  data.append("access_key", c.web3formsKey);
  data.append("subject", "New quote request: " + c.businessName);
  data.append("from_name", c.businessName + " website");
  try {
    const res = await fetch("https://api.web3forms.com/submit", { method: "POST", body: data });
    const out = await res.json();
    if (!out.success) throw new Error(out.message || "Submission failed");
    form.replaceChildren(h("p", { class: "form-success", role: "status" }, c.form.success));
  } catch (err) {
    console.error("Web3Forms:", err);
    btn.textContent = original;
    btn.disabled = false;
    say(c.form.error, "form-error");
  }
});
</script>
