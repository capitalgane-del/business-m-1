<script>

    heading: "On the job",

  reviewsHeading: "What customers say",
  reviews: [
    { quote: "Very professional team. Punctual, friendly and excellent problem-solving skills.", author: "Joy", meta: "Oneflare review", href: "https://www.oneflare.com.au/b/dutchies-removals" },

    { quote: "Allen arrived on time, packed everything efficiently and delivered to two locations for us.", author: "Joanna", meta: "Find a Mover review", href: "https://www.findamover.com.au/mover/dutchies-removals-2481" },

  reviewsMore: { text: "Read all 97 reviews on Muval", href: "https://www.muval.com.au/moving-companies/dutchies-removals" },

  faqHeading: "Questions",
  faqs: [
    { q: "Are quotes free?", a: "Yes. Quotes are free and done in your home, so we can see what is moving." },

    { q: "Will you take apart and rebuild our beds?", a: "Yes. We assemble and disassemble beds, attach and reattach washing machines and place your belongings exactly where you need them." },
    { q: "Can you pack for us?", a: "Yes. Our pre-pack service has your home packed up before moving day." },
    { q: "What is a backload?", a: "Your goods share truck space with other moves heading the same way. Ask us about backloads when you call." },
    { q: "Do you move single items?", a: "Yes. Single item removals are available." }

  contactHeading: "Get your free quote",
  // "Free in home quote available": listings. First sentence is a plain instruction (mine).
  contactSub: "Tell us where you are moving from and to. Free in-home quotes available.",
  promises: [
    "Free in-home quote",                // listings
    "Family owned and operated",         // Muval + Localsearch
    "Local, country and interstate",     // Muval
    "Backloads and pre-pack service"     // listings
  ],

  areasHeading: "Where we move",
  // ACT, NSW, VIC, QLD: their Facebook listing. Queanbeyan: a review describes a move there.
  areas: ["Canberra and the ACT", "Queanbeyan", "New South Wales", "Victoria", "Queensland"],

  // Get a key at web3forms.com after the client signs up, or use your own and forward leads.
  web3formsKey: "YOUR_WEB3FORMS_ACCESS_KEY_HERE",

  // LINKS: their other profiles, listed in the footer and opened in a new tab so the site stays open.
  // URLs from search results (the pages themselves were blocked during research): click-check each.
  // Facebook: their page ID from a Facebook mirror listing; Facebook redirects it to the page.
  // Left out: the old Toukley NSW listings (Yellow Pages, Yelp) with out-of-date hours and address.
  links: [
    { label: "Facebook", href: "https://www.facebook.com/1479089482380269", icon: "facebook-logo" },
    { label: "Muval reviews", href: "https://www.muval.com.au/moving-companies/dutchies-removals" },
    { label: "Oneflare", href: "https://www.oneflare.com.au/b/dutchies-removals" },
    { label: "ServiceSeeking", href: "https://www.serviceseeking.com.au/profile/101851-dutchies-removals" },
    { label: "Find a Mover", href: "https://www.findamover.com.au/mover/dutchies-removals-2481" },
    { label: "Localsearch", href: "https://www.localsearch.com.au/profile/dutchies-removals/isabella-plains-act/ip3B" },
    { label: "Service.com.au", href: "https://www.service.com.au/listing/removalist-canberra-2600-dutchies-removals" },
    { label: "Sirelo", href: "https://sirelo.com.au/removalist/monash/dutchies-removals/" },

  // primary = brand colour. onPrimary = text on it (use #FAFAF8 on dark colours, #15191C on light ones).

  // dark = hero, service tiles and footer. accent = small highlights on dark.

</script>
<script>
  // Sets title, description and brand colours before first paint.
  document.title = content.pageTitle;
  document.querySelector('meta[name="description"]').setAttribute("content", content.metaDescription);
  document.querySelector('meta[name="theme-color"]').setAttribute("content", content.colours.primary);
  document.documentElement.style.setProperty("--color-primary", content.colours.primary);
  document.documentElement.style.setProperty("--on-primary", content.colours.onPrimary);
  if (content.colours.dark) document.documentElement.style.setProperty("--dark", content.colours.dark);
  if (content.colours.accent) document.documentElement.style.setProperty("--accent", content.colours.accent);
  if (content.heroImage) {
    document.documentElement.style.setProperty("--hero-image", 'url("' + content.heroImage + '")');
    document.documentElement.setAttribute("data-hero-image", "true");
  }
</script>

<style>
  /* Design read: local trade lead-gen site for homeowners on phones, trust-first,
     static HTML + CSS variables + Phosphor icons. One radius, one accent, one theme
     (light or dark follows the visitor's device). */
  :root {
    --color-primary: #D32930;
    --on-primary: #FFFFFF;
    /* Dutchies: neutrals tinted toward their navy and cream instead of the template's green-greys. */
    --dark: #0D082B;
    --accent: #F7BD8D;

    --bg: #FAF7F3;
    --surface: #FFFDFA;
    --ink: #14112A;
    --muted: #4D4A63;
    --border: rgba(20, 17, 42, 0.12);
    --field: #FFFDFA;
    --band: color-mix(in srgb, var(--color-primary) 8%, var(--bg));
    --primary-text: var(--color-primary);

    --font: "Outfit", ui-sans-serif, system-ui, -apple-system, sans-serif;
    --font-display: "Sancreek", Georgia, "Times New Roman", serif;
    --font-script: "Pinyon Script", "Brush Script MT", cursive;
    --r: 12px;
    --max: 1200px;
    --header-h: 72px;
    --hero-image: none;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0B0918;
      --surface: #15122A;
      --ink: #EEEBF5;
      --muted: #B3AFC8;
      --border: rgba(238, 235, 245, 0.14);
      --field: #0B0918;
      --band: color-mix(in srgb, var(--color-primary) 16%, var(--bg));
      --primary-text: color-mix(in srgb, var(--color-primary) 45%, #FFFFFF);
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  @media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
  body {
    font-family: var(--font);
    font-size: 1.0625rem;
    line-height: 1.55;
    color: var(--ink);
    background: var(--bg);
    padding-bottom: 76px;
  }
  @media (min-width: 768px) { body { padding-bottom: 0; } }
  img { max-width: 100%; display: block; }
  a { color: inherit; text-decoration: none; }
  ul { list-style: none; }
  i[class^="ph"] { line-height: 1; }

  h1, h2, h3 { font-weight: 800; letter-spacing: -0.03em; line-height: 1.05; overflow-wrap: break-word; }
  h2 { font-size: clamp(2.1rem, 5.2vw, 3.6rem); }
  h3 { font-size: 1.35rem; letter-spacing: -0.015em; line-height: 1.2; }

  :focus-visible { outline: 3px solid var(--primary-text); outline-offset: 3px; }

  .wrap { max-width: var(--max); margin: 0 auto; }
  .sec { padding: clamp(4rem, 9vw, 7.5rem) 1.25rem; }
  .sec-head { margin-bottom: clamp(2rem, 4vw, 3.25rem); }
  .sec-head p { margin-top: 1rem; color: var(--muted); font-size: 1.15rem; max-width: 52ch; }

  /* ---------- Buttons ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 0.6rem;
    min-height: 56px; padding: 0.9rem 1.75rem;
    font-family: var(--font); font-size: 1.1rem; font-weight: 700; white-space: nowrap;
    border-radius: var(--r); border: 0; cursor: pointer;
    transition: transform 0.15s ease, filter 0.15s ease;
  }
  .btn:active { transform: translateY(1px) scale(0.98); }
  .btn-primary { background: var(--color-primary); color: var(--on-primary); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.16); }
  .btn-primary:hover { filter: brightness(1.12); }
  .btn-light { background: #FFFDFA; color: var(--dark); }
  .btn-light:hover { filter: brightness(0.94); }
  .btn-outline { background: rgba(255, 255, 255, 0.08); color: #F6F6F3; box-shadow: inset 0 0 0 2px rgba(246, 246, 243, 0.75); }
  .btn-outline:hover { background: rgba(255, 255, 255, 0.18); }

  /* ---------- Header ---------- */
  .site-header {
    position: sticky; top: 0; z-index: 50; height: var(--header-h);
    display: flex; align-items: center; background: var(--bg); border-bottom: 1px solid var(--border);
  }
  .site-header .wrap { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 0 1.25rem; }
  .brand { font-weight: 800; font-size: 1.3rem; letter-spacing: -0.02em; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* Dutchies only: on phones the name would be cut to "Dutchies Rem...". Stack it instead. */
  @media (max-width: 600px) { .brand { white-space: normal; line-height: 1.05; } }
  .nav { display: none; gap: 2rem; font-weight: 500; }
  .nav a { color: var(--muted); }
  .nav a:hover { color: var(--ink); }
  @media (min-width: 900px) { .nav { display: flex; } }
  .header-cta { min-height: 48px; padding: 0.5rem 1.15rem; font-size: 1rem; flex-shrink: 0; }

  /* ---------- Hero ---------- */
  #hero {
    position: relative; isolation: isolate; color: #F6F6F3;
    min-height: min(88dvh, 840px); display: flex; align-items: center;
    padding: 5rem 1.25rem 4rem;
    /* Dutchies: the glowing red-orange panel from their logo (see "logo presentation" below). */
    background: var(--glow);
    background-size: cover; background-position: center;
  }
  @media (min-width: 900px) { #hero { background: var(--glow-wide); } }
  html[data-hero-image] #hero { background-image: var(--hero-image), linear-gradient(135deg, var(--dark), #000); }
  /* Darkening overlay only matters over a photo. */
  html[data-hero-image] #hero::before {
    content: ""; position: absolute; inset: 0; z-index: -1;
    background: linear-gradient(90deg, rgba(13, 8, 43, 0.86) 0%, rgba(13, 8, 43, 0.6) 55%, rgba(13, 8, 43, 0.3) 100%);
  }
  #hero .wrap { width: 100%; }
  /* Dutchies: emblem with the slogan underneath, stacked like their logo. Beside the headline
     on desktop, above it on phones. */
  #hero .wrap.has-badge { display: grid; gap: 1.5rem; align-items: center; }
  .hero-mark { display: grid; justify-items: center; width: min(100%, 220px); }
  .hero-badge { width: 100%; height: auto; }
  @media (min-width: 900px) {
    #hero .wrap.has-badge { grid-template-columns: minmax(0, 1fr) minmax(0, 360px); gap: 3.5rem; }
    .hero-mark { order: 2; width: 100%; }
  }
  @media (min-width: 1200px) { #hero .wrap.has-badge { grid-template-columns: minmax(0, 1fr) minmax(0, 440px); gap: 4.5rem; } }
  #hero h1 { font-size: clamp(2.7rem, 7vw, 5rem); max-width: 18ch; letter-spacing: -0.04em; }
  .hero-sub { margin-top: 1.5rem; font-size: clamp(1.15rem, 2.2vw, 1.5rem); max-width: 34ch; color: rgba(246, 246, 243, 0.92); line-height: 1.4; }
  .hero-actions { margin-top: 2.25rem; display: flex; flex-wrap: wrap; gap: 0.85rem; }
  @media (max-width: 480px) { .hero-actions .btn { width: 100%; } }

  /* ---------- Trust bar ---------- */
  .trust { background: var(--color-primary); color: var(--on-primary); padding: 2.25rem 1.25rem; }
  .trust-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.75rem 1.25rem; }
  @media (min-width: 900px) { .trust-grid { grid-template-columns: repeat(4, 1fr); } }
  .trust-item { display: flex; gap: 0.9rem; align-items: flex-start; }
  .trust-item > i { font-size: 2rem; flex-shrink: 0; margin-top: 0.15rem; }
  .trust-value { font-weight: 800; font-size: 1.35rem; letter-spacing: -0.02em; line-height: 1.15; }
  /* Dutchies: full opacity here, on the feature review and in contact. Faded white on this red fails contrast. */
  .trust-label { font-size: 0.95rem; line-height: 1.35; margin-top: 0.2rem; }
  .stars { display: inline-flex; gap: 2px; font-size: 1rem; margin-top: 0.3rem; }

  /* ---------- Services ---------- */
  .svc-grid { display: grid; grid-template-columns: 1fr; gap: 1rem; }
  @media (min-width: 768px) {
    .svc-grid { grid-template-columns: repeat(3, 1fr); grid-auto-flow: dense; }
    .svc.wide { grid-column: span 2; }
  }
  .svc {
    position: relative; isolation: isolate; overflow: hidden; color: #F6F6F3;
    min-height: 340px; display: flex; align-items: flex-end;
    border-radius: var(--r);
    background: radial-gradient(120% 100% at 100% 0%, color-mix(in srgb, var(--color-primary) 55%, var(--dark)) 0%, var(--dark) 62%);
  }
  .svc img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -2; }
  .svc::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, rgba(13, 8, 43, 0) 30%, rgba(13, 8, 43, 0.88) 100%); }
  .svc-body { padding: 1.5rem; width: 100%; }
  .svc-body p { margin-top: 0.4rem; max-width: 36ch; color: rgba(246, 246, 243, 0.92); font-size: 1rem; line-height: 1.4; }
  @media (hover: hover) and (prefers-reduced-motion: no-preference) {
    .svc img { transition: transform 0.5s ease; }
    .svc:hover img { transform: scale(1.04); }
  }

  /* ---------- Work ---------- */
  #work { background: var(--band); }
  .ba-grid { display: grid; gap: 1.5rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); }
  .ba-stage { position: relative; aspect-ratio: 4 / 3; overflow: hidden; border-radius: var(--r); --pos: 50%; background: var(--surface); }
  .ba-stage img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .ba-before { clip-path: inset(0 calc(100% - var(--pos)) 0 0); }
  .ba-line { position: absolute; top: 0; bottom: 0; left: var(--pos); width: 3px; background: #F6F6F3; transform: translateX(-50%); pointer-events: none; }
  .ba-knob {
    position: absolute; top: 50%; left: var(--pos); transform: translate(-50%, -50%);
    width: 48px; height: 48px; border-radius: var(--r); background: #F6F6F3; color: #15191C;
    display: grid; place-items: center; font-size: 1.4rem; pointer-events: none;
  }
  .ba-stage input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: ew-resize; margin: 0; }
  .ba-stage:has(input:focus-visible) { outline: 3px solid var(--primary-text); outline-offset: 3px; }
  .ba-caption { display: flex; justify-content: space-between; gap: 1rem; margin-top: 0.75rem; font-weight: 600; }
  .ba-caption span:nth-child(2) { color: var(--muted); font-weight: 500; text-align: center; }
  .gallery { margin-top: 3rem; columns: 2; column-gap: 1rem; }
  @media (min-width: 768px) { .gallery { columns: 3; } }
  .gallery img { width: 100%; margin-bottom: 1rem; border-radius: var(--r); break-inside: avoid; }

  /* ---------- Reviews ---------- */
  .rev { display: grid; gap: 1.25rem; }
  @media (min-width: 900px) { .rev { grid-template-columns: 5fr 7fr; } }
  .rev-feature {
    background: var(--color-primary); color: var(--on-primary); border-radius: var(--r);
    padding: clamp(1.75rem, 4vw, 2.75rem); display: flex; flex-direction: column; justify-content: space-between; gap: 2rem;
  }
  .rev-feature blockquote { font-size: clamp(1.35rem, 2.6vw, 1.9rem); font-weight: 600; line-height: 1.3; letter-spacing: -0.01em; }
  .rev-list { display: grid; gap: 1rem; align-content: start; }
  .rev-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 1.5rem; }
  .rev-card blockquote { font-size: 1.1rem; margin: 0.6rem 0 1rem; }
  .rev-card .stars { color: var(--primary-text); margin: 0; }
  .rev-author { font-weight: 700; }
  .rev-meta { font-size: 0.95rem; color: var(--muted); }
  .rev-feature .rev-meta { color: var(--on-primary); }

  /* ---------- Process ---------- */
  #process { background: var(--band); }
  .proc { display: grid; gap: 2.5rem; }
  @media (min-width: 900px) { .proc { grid-template-columns: 5fr 7fr; align-items: start; } }
  .step { display: grid; grid-template-columns: 60px 1fr; gap: 1.1rem; padding: 1.4rem 0; border-top: 1px solid var(--border); }
  .step:first-child { border-top: 0; padding-top: 0; }
  .step-icon { width: 60px; height: 60px; border-radius: var(--r); background: var(--color-primary); color: var(--on-primary); display: grid; place-items: center; font-size: 1.6rem; }
  .step p { color: var(--muted); margin-top: 0.3rem; }

  /* ---------- Contact ---------- */
  #contact { background: var(--color-primary); color: var(--on-primary); }
  .contact-grid { display: grid; gap: 2.5rem; }
  @media (min-width: 900px) { .contact-grid { grid-template-columns: 1fr 1fr; align-items: start; gap: 4rem; } }
  .contact-sub { margin-top: 1rem; font-size: 1.15rem; max-width: 40ch; }
  .promises { margin-top: 1.75rem; display: grid; gap: 0.8rem; }
  .promises li { display: flex; gap: 0.75rem; align-items: center; font-size: 1.15rem; font-weight: 500; }
  .promises i { font-size: 1.5rem; flex-shrink: 0; }
  .big-phone { display: inline-flex; align-items: center; gap: 0.75rem; margin-top: 2rem; font-size: clamp(1.9rem, 4.5vw, 2.9rem); font-weight: 800; letter-spacing: -0.03em; }
  .form-card { background: var(--surface); color: var(--ink); border-radius: var(--r); padding: clamp(1.5rem, 3vw, 2.25rem); }
  #contact-form { display: grid; gap: 1.1rem; }
  #contact-form label { display: grid; gap: 0.45rem; font-weight: 600; font-size: 0.98rem; }
  #contact-form input, #contact-form textarea {
    font-family: var(--font); font-size: 1rem; color: var(--ink); background: var(--field);
    min-height: 52px; padding: 0.8rem 0.9rem; border: 1.5px solid color-mix(in srgb, var(--ink) 40%, transparent); border-radius: var(--r);
  }
  #contact-form textarea { min-height: 120px; resize: vertical; }
  #contact-form button { width: 100%; }
  .form-note { font-size: 0.92rem; color: var(--muted); }
  .form-success { font-size: 1.3rem; font-weight: 700; line-height: 1.3; }
  .form-error { color: #B3261E; font-weight: 600; }
  @media (prefers-color-scheme: dark) { .form-error { color: #F2B8B5; } }
  .hp { position: absolute; left: -9999px; }

  /* ---------- Areas ---------- */
  .areas { display: flex; flex-wrap: wrap; gap: 0.6rem; }
  .areas li { padding: 0.6rem 1.1rem; border: 1.5px solid var(--border); border-radius: var(--r); font-weight: 600; background: var(--surface); }

  /* ---------- Footer ---------- */
  footer { background: var(--dark); color: #F3F0FA; padding: 3rem 1.25rem; }
  .foot { display: grid; gap: 2rem; }
  @media (min-width: 768px) { .foot { grid-template-columns: 1.4fr 1fr 1fr; } }
  .foot h3 { font-size: 1.25rem; margin-bottom: 0.6rem; }
  .foot p, .foot a { color: #B8B4CC; display: block; }
  .foot a:hover { color: #FFFFFF; }

  /* ---------- Hover pop (mouse only, never on touch or reduced motion) ---------- */
  @media (hover: hover) and (pointer: fine) and (prefers-reduced-motion: no-preference) {
    .btn, .svc, .rev-card, .gallery img, .areas li, .step-icon {
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.25s ease,
                  background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease, filter 0.15s ease;
    }
    .btn:hover { transform: translateY(-3px) scale(1.04); }
    .btn:active { transform: translateY(0) scale(0.98); }
    .btn-primary:hover { box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.16), 0 14px 26px -8px color-mix(in srgb, var(--color-primary) 75%, transparent); }
    .btn-light:hover { box-shadow: 0 14px 28px -8px rgba(0, 0, 0, 0.6); }
    .btn-outline:hover { box-shadow: inset 0 0 0 2px #F6F6F3, 0 14px 28px -8px rgba(0, 0, 0, 0.6); }
    .svc:hover { transform: translateY(-6px); box-shadow: 0 22px 40px -14px color-mix(in srgb, var(--color-primary) 65%, transparent); }
    .rev-card:hover { transform: translateY(-4px); box-shadow: 0 16px 30px -12px color-mix(in srgb, var(--color-primary) 45%, transparent); }
    .gallery img:hover { transform: translateY(-4px) scale(1.02); box-shadow: 0 16px 30px -12px color-mix(in srgb, var(--color-primary) 45%, transparent); }
    .areas li:hover {
      transform: translateY(-3px) scale(1.07);
      background: var(--color-primary); color: var(--on-primary); border-color: var(--color-primary);
      box-shadow: 0 12px 22px -8px color-mix(in srgb, var(--color-primary) 70%, transparent);
    }
    .step:hover .step-icon { transform: scale(1.1); box-shadow: 0 12px 22px -8px color-mix(in srgb, var(--color-primary) 70%, transparent); }
  }

  /* ---------- Motion ----------
     Hero: one load sequence. Everything else: a single fade-up as it scrolls into view.
     Only runs when the visitor has not asked for reduced motion. Content is never
     hidden unless the script has confirmed it can reveal it again (html.js-reveal). */
  @media (prefers-reduced-motion: no-preference) {
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    #hero h1, .hero-sub, .hero-actions, .hero-mark { animation: rise 0.8s cubic-bezier(0.16, 1, 0.3, 1) both; }
    .hero-mark { animation-delay: 0.18s; }
    .hero-sub { animation-delay: 0.12s; }
    .hero-actions { animation-delay: 0.24s; }

    html.js-reveal .reveal {
      opacity: 0; transform: translateY(14px);
      transition: opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1), transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
      transition-delay: calc(var(--i, 0) * 80ms);
    }
    html.js-reveal .reveal.in { opacity: 1; transform: none; }
  }

  /* ---------- Mobile bar and sample ribbon ---------- */
  .mobile-bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
    display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem;
    padding: 0.65rem 0.75rem calc(0.65rem + env(safe-area-inset-bottom));
    background: var(--bg); border-top: 1px solid var(--border);
  }
  .mobile-bar .btn { min-height: 52px; padding: 0.6rem 0.75rem; font-size: 1rem; }
  .mobile-bar .btn-quote { background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 2px var(--ink); }
  @media (min-width: 768px) { .mobile-bar { display: none; } }
  .sample-ribbon {
    position: fixed; left: 0.6rem; bottom: 88px; z-index: 60; background: #B3261E; color: #fff;
    padding: 0.4rem 0.75rem; border-radius: var(--r); font-weight: 700; font-size: 0.85rem;
  }
  @media (min-width: 768px) { .sample-ribbon { bottom: 0.75rem; } }

  /* ---------- Dutchies: logo presentation ----------
     Their logo is navy Western lettering and a lion on a glowing red-orange panel, with a cream
     script underneath. The hero, featured review and quote section reuse that panel with navy
     type; the trust bar and footer flip it to cream on navy. Glow colours are sampled from the
     logo: bright orange behind the text (so navy keeps 4.5:1 contrast), falling to their deep
     red around the emblem and slogan, where the logo's own script sits on red.
     Sancreek is the closest Google font to the lettering (solid Tuscan with the same mid-stem
     spurs, scored against the logo); a hairline outline brings it up to the logo's weight. One
     weight, so no fake bold. Pinyon Script is close to the script. Body text stays Outfit. */
  :root {
    --on-glow: #0D082B;
    --cream: #FBE9D2;
    /* Phones: emblem on top in the red, text lower in the bright centre. */
    --glow: radial-gradient(150% 62% at 50% 72%, #EE9466 0%, #E66F42 38%, #E25B3C 62%, #D93E31 84%, #C8202D 100%);
    /* Desktop: bright behind the left text column, red around the emblem on the right. */
    --glow-wide: radial-gradient(70% 115% at 28% 48%, #EE9466 0%, #E66F42 34%, #E25B3C 56%, #D93E31 76%, #C8202D 100%);
    /* Text all over (stacked quote section on phones): never darker than #DD4D36. */
    --glow-safe: radial-gradient(130% 85% at 50% 30%, #EE9466 0%, #E66F42 40%, #E25B3C 72%, #DD4D36 100%);
  }
  h1, h2, h3, .brand, .trust-value { font-family: var(--font-display); font-weight: 400; text-transform: uppercase; letter-spacing: 0.08em; -webkit-text-stroke: 0.018em currentColor; }
  #hero h1 { font-size: clamp(2.3rem, 5.4vw, 4.1rem); line-height: 1.08; letter-spacing: 0.07em; max-width: 15ch; }
  h2 { font-size: clamp(1.9rem, 4.2vw, 3.1rem); line-height: 1.12; }
  h3 { font-size: 1.3rem; line-height: 1.25; }
  .trust-value { font-size: 1.25rem; line-height: 1.25; }
  .brand { font-size: 1.25rem; }

  #hero { color: var(--on-glow); }
  #hero .hero-sub { color: var(--on-glow); }
  #hero .btn-light { background: var(--on-glow); color: var(--cream); }
  #hero .btn-outline { background: transparent; color: var(--on-glow); box-shadow: inset 0 0 0 2px var(--on-glow); }
  #hero .btn-outline:hover { background: rgba(13, 8, 43, 0.08); box-shadow: inset 0 0 0 2px var(--on-glow), 0 14px 28px -8px rgba(0, 0, 0, 0.35); }
  .hero-tagline { font-family: var(--font-script); color: #FFF4E6; font-size: clamp(1.7rem, 2.6vw, 2.3rem); line-height: 1.1; margin-top: -0.15rem; text-shadow: 0 1px 1px rgba(13, 8, 43, 0.45), 0 0 16px rgba(110, 15, 30, 0.45); }

  .trust { background: var(--dark); color: var(--cream); }
  .trust-item > i, .trust .stars { color: var(--accent); }
  a.trust-value { display: block; width: fit-content; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 4px; }

  .rev-feature { background: radial-gradient(140% 100% at 25% 15%, #EE9466 0%, #E66F42 45%, #E25B3C 100%); color: var(--on-glow); }
  .rev-feature .rev-meta { color: var(--on-glow); }
  .rev-meta a { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
  .rev-more { margin-top: 1.5rem; font-weight: 600; }
  .rev-more a { display: inline-flex; align-items: center; gap: 0.4rem; color: var(--primary-text); text-decoration: underline; text-underline-offset: 4px; }

  #contact { background: var(--glow-safe); color: var(--on-glow); }
  @media (min-width: 900px) { #contact { background: var(--glow-wide); } }
  #hero :focus-visible, #contact :focus-visible, .rev-feature :focus-visible { outline-color: var(--on-glow); }

  .foot .foot-tagline { font-family: var(--font-script); color: var(--accent); font-size: 1.7rem; line-height: 1.1; margin: -0.1rem 0 0.5rem; }
  @media (min-width: 768px) { .foot { grid-template-columns: 1fr 1fr; } }
  @media (min-width: 1100px) { .foot { grid-template-columns: 1.3fr 1fr 1fr 1fr; } }
  .foot-links { display: grid; gap: 0.3rem; }
  .foot-links a { display: inline-flex; align-items: center; gap: 0.5rem; }

  /* Services carousel: native scroll with snap, so swipe, trackpad and keyboard all work. */
  .car-track { list-style: none; display: flex; gap: 1rem; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior-x: contain; padding: 0.25rem 0.1rem 0.5rem; }
  .car-track::-webkit-scrollbar { display: none; }
  .car-track:focus-visible { outline: 3px solid var(--primary-text); outline-offset: 3px; }
  .car-card {
    flex: 0 0 min(80%, 300px); scroll-snap-align: start; min-height: 220px; padding: 1.5rem;
    display: flex; flex-direction: column; border-radius: var(--r); color: #F6F6F3;
    background: radial-gradient(120% 100% at 100% 0%, color-mix(in srgb, var(--color-primary) 55%, var(--dark)) 0%, var(--dark) 62%);
  }
  .car-icon { width: 52px; height: 52px; display: grid; place-items: center; border-radius: var(--r); background: rgba(247, 189, 141, 0.14); color: var(--accent); font-size: 1.6rem; margin-bottom: auto; }
  .car-card h3 { margin-top: 1.5rem; color: var(--cream); }
  .car-card p { margin-top: 0.4rem; color: rgba(246, 246, 243, 0.92); font-size: 1rem; line-height: 1.4; }
  .car-nav { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-top: 1rem; }
  .car-btn { width: 48px; height: 48px; flex-shrink: 0; display: grid; place-items: center; border: 0; border-radius: 50%; background: var(--dark); color: var(--cream); font-size: 1.2rem; cursor: pointer; }
  .car-btn:hover { background: var(--color-primary); color: #fff; }
  .car-dots { display: flex; }
  .car-dot { position: relative; width: 28px; height: 28px; padding: 0; border: 0; background: none; cursor: pointer; }
  .car-dot::before { content: ""; position: absolute; left: 9px; top: 9px; width: 10px; height: 10px; border-radius: 5px; background: color-mix(in srgb, var(--ink) 28%, transparent); transition: width 0.2s ease, left 0.2s ease; }
  .car-dot[aria-current="true"]::before { left: 4px; width: 20px; background: var(--color-primary); }
  @media (min-width: 900px) { .car-nav { justify-content: flex-start; } .car-dots { order: 3; margin-left: 1rem; } }

  /* Jump links (nav, "Get a Free Quote") land below the sticky header, not under it. */
  section[id] { scroll-margin-top: var(--header-h); }

  /* About: their job photo beside their own words. Shaded so sections alternate. */
  #about { background: var(--band); }
  .about { display: grid; gap: 2rem; align-items: center; }
  @media (min-width: 900px) { .about { grid-template-columns: 1fr 1fr; gap: 4rem; } }
  .about-photo { width: 100%; height: auto; border-radius: var(--r); box-shadow: 0 30px 60px -30px rgba(13, 8, 43, 0.55); }
  .about-body p { margin-top: 1rem; color: var(--muted); font-size: 1.15rem; max-width: 44ch; }
  .about-body .btn { margin-top: 1.75rem; }

  /* FAQ: native details/summary. */
  .faq { max-width: 820px; }
  .faq details { border-top: 1px solid var(--border); }
  .faq details:last-child { border-bottom: 1px solid var(--border); }
  .faq summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: 1.15rem 0; font-weight: 700; font-size: 1.1rem; }
  .faq summary::-webkit-details-marker { display: none; }
  .faq summary::after { content: "+"; flex-shrink: 0; font-size: 1.6rem; font-weight: 400; line-height: 1; color: var(--primary-text); transition: transform 0.2s ease; }
  .faq details[open] summary::after { transform: rotate(45deg); }
  .faq details p { padding-bottom: 1.25rem; color: var(--muted); max-width: 62ch; }

  /* Quote form: from / to side by side when there is room; optional notes field shorter. */
  .form-row { display: grid; gap: 1.1rem; }
  @media (min-width: 520px) { .form-row { grid-template-columns: 1fr 1fr; } }
  #contact-form textarea { min-height: 96px; }
  .form-note a { color: var(--primary-text); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
</style>
</head>
<body>
<div id="app"></div>
<noscript><p style="padding:2rem">Please enable JavaScript to view this page.</p></noscript>

<script>
// Renders content into the page. Nothing here is client-specific.
const c = content;
const app = document.getElementById("app");

function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  Object.entries(props || {}).forEach(([k, v]) => {
    if (v === false || v == null) return;
    if (k === "class") el.className = v;
    else el.setAttribute(k, v);
  });
  kids.flat().forEach(k => { if (k != null && k !== false) el.append(k.nodeType ? k : document.createTextNode(k)); });
  return el;
}
const icon = (name, weight) => h("i", { class: (weight || "ph-bold") + " ph-" + name, "aria-hidden": "true" });
const stars = (n, label) => {
  const s = h("span", { class: "stars", role: "img", "aria-label": label || (n + " out of 5 stars") });
  for (let i = 0; i < n; i++) s.append(icon("star", "ph-fill"));
  return s;
};
const section = (id, cls, inner) => h("section", { id, class: cls }, h("div", { class: "wrap" }, inner));
const head = (title, sub) => h("div", { class: "sec-head" }, h("h2", {}, title), sub ? h("p", {}, sub) : null);
// Dutchies: links to their other profiles open in a new tab so the site stays open.
const ext = (href, cls, ...kids) => h("a", { href, class: cls, target: "_blank", rel: "noopener" }, kids);

const hasWork = (c.beforeAfter && c.beforeAfter.length) || (c.gallery && c.gallery.length);
const hasReviews = c.reviews && c.reviews.length;

// ----- Header -----
const navLinks = [
  ["Services", "#services", c.services && c.services.length],
  ["Work", "#work", hasWork],
  ["About", "#about", c.about],
  ["Reviews", "#reviews", hasReviews],
  ["FAQ", "#faq", c.faqs && c.faqs.length]
].filter(l => l[2]);
app.append(
  h("header", { class: "site-header" },
    h("div", { class: "wrap" },
      h("a", { class: "brand", href: "#" }, c.businessName),
      h("nav", { class: "nav", "aria-label": "Main" }, navLinks.map(l => h("a", { href: l[1] }, l[0]))),
      h("a", { class: "btn btn-primary header-cta", href: c.phoneHref }, icon("phone-call"), c.phone)
    )
  )
);

// ----- Hero -----
// Dutchies: emblem with the slogan in script underneath, laid out like their logo
// (content.heroBadge, content.tagline).
app.append(
  h("section", { id: "hero" },
    h("div", { class: "wrap" + (c.heroBadge ? " has-badge" : "") },
      c.heroBadge ? h("div", { class: "hero-mark" },
        h("img", { class: "hero-badge", src: c.heroBadge, alt: c.heroBadgeAlt || c.businessName, width: "551", height: "441" }),
        c.tagline ? h("p", { class: "hero-tagline" }, c.tagline) : null
      ) : null,
      h("div", {},
        h("h1", {}, c.heroHeading),
        h("p", { class: "hero-sub" }, c.heroSub),
        h("div", { class: "hero-actions" },
          h("a", { class: "btn btn-light", href: c.phoneHref }, icon("phone-call"), c.ctaText),
          h("a", { class: "btn btn-outline", href: "#contact" }, c.quoteText)
        )
      )
    )
  )
);

// ----- Trust bar -----
const trustCells = [];
if (c.rating) {
  trustCells.push(h("div", { class: "trust-item" },
    icon("star", "ph-fill"),
    h("div", {},
      c.rating.href ? ext(c.rating.href, "trust-value", c.rating.score + " on " + c.rating.source)
                    : h("div", { class: "trust-value" }, c.rating.score + " on " + c.rating.source),
      stars(5, "Rated " + c.rating.score + " out of 5"),
      h("div", { class: "trust-label" }, c.rating.count + " reviews")
    )
  ));
}
(c.trust || []).forEach(t => trustCells.push(
  h("div", { class: "trust-item" }, icon(t.icon),
    h("div", {}, t.href ? ext(t.href, "trust-value", t.value) : h("div", { class: "trust-value" }, t.value),
      h("div", { class: "trust-label" }, t.label)))
));
app.append(h("section", { class: "trust", "aria-label": "Why choose us" }, h("div", { class: "wrap trust-grid" }, trustCells)));

// ----- Services -----
// Dutchies: a compact carousel instead of the photo grid (no service photos to fill it).
// Native horizontal scroll with snap: swipe on phones, arrows and dots everywhere, wraps at the ends.
if (c.services && c.services.length) {
  const track = h("ul", { class: "car-track", tabindex: "0", "aria-label": c.servicesHeading },
    c.services.map((s, i) => h("li", { class: "car-card", "aria-roledescription": "slide", "aria-label": (i + 1) + " of " + c.services.length },
      h("span", { class: "car-icon" }, icon(s.icon || "truck")),
      h("h3", {}, s.name),
      h("p", {}, s.desc)
    ))
  );
  const prev = h("button", { class: "car-btn", type: "button", "aria-label": "Previous service" }, icon("caret-left"));
  const next = h("button", { class: "car-btn", type: "button", "aria-label": "Next service" }, icon("caret-right"));
  const dots = h("div", { class: "car-dots" }, c.services.map((s, i) =>
    h("button", { class: "car-dot", type: "button", "aria-label": "Show " + s.name })));
  const cards = [...track.children], dotEls = [...dots.children];
  const step = () => cards[1] ? cards[1].offsetLeft - cards[0].offsetLeft : track.clientWidth;
  const current = () => Math.round(track.scrollLeft / step());
  const atEnd = () => track.scrollLeft + track.clientWidth >= track.scrollWidth - 4;
  const go = i => track.scrollTo({ left: cards[(i + cards.length) % cards.length].offsetLeft - cards[0].offsetLeft,
    behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
  prev.addEventListener("click", () => go(track.scrollLeft <= 4 ? cards.length - 1 : current() - 1));
  next.addEventListener("click", () => go(atEnd() ? 0 : current() + 1));
  dotEls.forEach((d, i) => d.addEventListener("click", () => go(i)));
  const mark = () => { const i = atEnd() ? cards.length - 1 : current(); dotEls.forEach((d, j) => d.setAttribute("aria-current", j === i ? "true" : "false")); };
  track.addEventListener("scroll", () => requestAnimationFrame(mark), { passive: true });
  app.append(section("services", "sec", [
    head(c.servicesHeading, c.servicesSub),
    h("div", { class: "car", "aria-roledescription": "carousel" }, track,
      h("div", { class: "car-nav" }, prev, dots, next))
  ]));
  mark();
}

// ----- Work -----
if (hasWork) {
  const parts = [head(c.workHeading, c.workSub)];

// ----- Scroll reveal -----
// Skipped entirely for reduced motion or browsers without IntersectionObserver,
// so nothing is ever left invisible.
(function () {
  const calm = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (calm || !("IntersectionObserver" in window)) return;

  const groups = [
    ".trust-grid > .trust-item",
    ".sec-head",
    ".svc-grid > .svc",
    ".ba-grid > figure",
    ".rev-feature",
    ".rev-list > .rev-card",
    ".steps > .step",
    ".contact-grid > div",
    ".areas"
  ];
  const targets = [];
  groups.forEach(sel => {
    document.querySelectorAll(sel).forEach((el, i) => {
      el.classList.add("reveal");
      el.style.setProperty("--i", Math.min(i, 5)); // stagger within a group, capped
      targets.push(el);
    });
  });

  document.documentElement.classList.add("js-reveal");
  const io = new IntersectionObserver((entries) => {
    entries.forEach(en => {
      if (!en.isIntersecting) return;
      const el = en.target;
      el.classList.add("in");
      io.unobserve(el);
      // Once revealed, drop the reveal state so hover effects work without delay or conflict.
      const done = () => { el.classList.remove("reveal", "in"); el.style.removeProperty("--i"); };
      el.addEventListener("transitionend", function f(ev) {
        if (ev.target === el && ev.propertyName === "opacity") { el.removeEventListener("transitionend", f); done(); }
      });
      setTimeout(done, 2000);
    });
  }, { threshold: 0.12, rootMargin: "0px 0px -6% 0px" });
  targets.forEach(el => io.observe(el));
})();

// ----- Web3Forms submit -----
form.addEventListener("submit", async function (e) {
  e.preventDefault();
  const btn = form.querySelector('button[type="submit"]');
  const original = btn.textContent;
  btn.textContent = "Sending";
  btn.disabled = true;
  const data = new FormData(form);
  data.append("access_key", c.web3formsKey);
  data.append("subject", "New quote request: " + c.businessName);
  try {
    const res = await fetch("https://api.web3forms.com/submit", { method: "POST", body: data });
    const out = await res.json();
    if (!out.success) throw new Error(out.message || "Submission failed");
    form.replaceChildren(h("p", { class: "form-success" }, "Thanks, your details have been sent. For anything urgent, call " + c.phone + "."));
  } catch (err) {
    btn.textContent = original;
    btn.disabled = false;
    let msg = form.querySelector(".form-error");
    if (!msg) { msg = h("p", { class: "form-error", role: "alert" }); form.append(msg); }
    msg.textContent = "That did not send. Please call " + c.phone + " instead.";
  }
});
</script>
