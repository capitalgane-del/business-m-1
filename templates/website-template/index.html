  metaDescription: "Coffee van on the east side of Lake Tuggeranong, Greenway ACT. Barista coffee, tea, smoothies, shakes and fresh baking. Open Sat & Sun 8am–1pm. 0428 720 929.",

  phone: "0428 720 929",
  phoneHref: "tel:+61428720929", // digits only after tel:, no spaces

  suburb: "Greenway",
  address: "Mortimer Lewis Dr, Greenway ACT 2900",

  // Replaces the business name in both the header and the footer. The wordmark

  // both use colours.secondary, which is sampled from the logo's own background.

  logo: { src: LOGO_SRC, alt: "Mimi's Pit Stop" },

  heroHeading: "Barista Coffee by Lake Tuggeranong",
  ctaText: "Call to Order",

  hours: "Open Sat & Sun · 8am – 1pm",

  // The client's own shot of the trailer set up and serving. Cropped 2:1 with
  // the trailer dead centre, because the hero renders anywhere from ~4:1 on
  // desktop to ~1:1 on mobile and background-size:cover crops toward the
  // centre. A dark overlay is applied automatically so the text stays readable.
  heroImage: PHOTOS.heroTrailer,

  // There is no set menu — this is a hobby business and what's in the cabinet
  // changes week to week, so the list below is CATEGORIES ONLY, no prices and
  // no specific items that could go stale. Anything time-sensitive belongs on
  // Facebook, which is where Mimi actually posts, not here.
  servicesHeading: "On the Menu",

  // Rendered as a lead paragraph above the list. "{link}" is substituted with a
  // real anchor at render time — keep the token in the string, and keep the
  // whole thing plain text (no HTML) so nothing gets injected into the page.
  servicesNote: {
    text: "There's no set menu here — all the classic drinks are on every day, and Mimi bakes something new most weeks. Whatever's fresh goes up on {link} first, so have a look before you head down.",
    linkText: "the Mimi's Pit Stop Facebook page",
    url: "https://www.facebook.com/Mimispitstop/"
  },

  services: [

    "Tea & Chai — English breakfast, earl grey, peppermint, chai latte",
    "Smoothies & Shakes — blended fresh to order",
    "Hot Chocolate & Hot Cider — the cider comes out in the cooler months",
    "Iced & Cold Drinks — iced coffee, iced chocolate and cold cans",
    "Fresh Baking — scones, slices, cakes and muffins, changing week to week",
    "Toast & Healthy Snacks — something light for the walk around the lake"

  // Real Google reviews, quoted verbatim — only whitespace was normalised.
  // Do not reword these; they are attributed to named people.
  // NOTE: the star ratings did not come through with the pasted text. Both read

  testimonialsHeading: "What the Regulars Say",
  testimonials: [

      author: "Brett Gray · Local Guide, Google",
      stars: 5

      author: "Michael McRoberts · Local Guide, Google",
      stars: 5
    },
    {
      quote: "If you are walking around the lake this is the best place to get coffee and chat.",
      author: "gustavo smith · Local Guide, Google",
      stars: 5
    }
  ],

  // Deep link to the Google listing's review tab (the !1b1 in the URL is what
  // opens reviews rather than the map pin), so the three above can be checked

  moreReviews: {
    url: "https://www.google.com/maps/place/Mimi's+Pit+Stop/@-35.405754,149.068047,16.46z/data=!4m8!3m7!1s0x6b17b5632547bc51:0x89d686a33f60fdfc!8m2!3d-35.4074555!4d149.0709704!9m1!1b1!16s%2Fg%2F11csbbv3hk?entry=ttu&g_ep=EgoyMDI2MDgxMi4wIKXMDSoASAFQAw%3D%3D",
    text: "50+ more Google reviews"

  gallery: [
    { src: PHOTOS.latte,   alt: "Chocolate-swirled latte art in a takeaway cup, in front of the van" },
    { src: PHOTOS.van,     alt: "The van on a frosty morning, with “Mimi's” drawn in the frost" },
    { src: PHOTOS.scones,  alt: "Warm scones with butter and golden syrup on a picnic table" },

  web3formsKey: "3391f802-c7be-4c43-886b-ea0d077f343f",

  // secondary — sampled from the logo's own background, so the header and

  //   dark text instead of white and so stays legible.
  colours: {
    primary: "#8A5A11",
    secondary: "#19181C",
    accent: "#E0A82E",

    // the black header, the black footer and the black trailer in the hero, and
    // it left the white cards invisible on it. This is warm enough to sit with
    // the logo gold and the kraft signage in the photos, and dark enough that
    // the white cards read as cards. Checked against the fixed ink (13.4:1) and
    // against primary, which is what the Facebook link uses (4.8:1) — both pass

    bg: "#F0E7D8"
  }

<script>
  // Runs synchronously, before first paint — sets title, meta description,
  // and colour variables immediately so there's no flash of default values.
  document.title = content.pageTitle;
  document.querySelector('meta[name="description"]').setAttribute("content", content.metaDescription);
  document.documentElement.style.setProperty("--color-primary", content.colours.primary);
  document.documentElement.style.setProperty("--color-secondary", content.colours.secondary);
  document.documentElement.style.setProperty("--color-accent", content.colours.accent);
  // Optional — omit colours.bg and the near-neutral default in :root stands.
  if (content.colours.bg) {
    document.documentElement.style.setProperty("--color-bg", content.colours.bg);
  }
  if (content.heroImage) {
    document.documentElement.style.setProperty("--hero-image", `url("${content.heroImage}")`);
    document.documentElement.setAttribute("data-hero-image", "true");
  }
</script>

<style>
  :root {
    /* Client-driven — fallback values only, real values get set above from content.js */
    --color-primary: #0057B8;
    --color-secondary: #1A1A1A;
    --color-accent: #E0A82E;

    /* Page background — optional per client (colours.bg), falling back to this
       near-neutral. Only ever go light here: ink below is fixed, so a dark value
       would put dark text on a dark page. */
    --color-bg: #FAFAF9;

    /* Fixed tokens — not client-driven. Arbitrary client hex can't be trusted
       for body text contrast, so ink stays constant regardless of brand colour. */
    --color-ink: #201F1D;
    /* Tint of the page itself, not of white — so it stays a shade *of* the
       background whatever the client sets that to, instead of drifting lighter
       than the page and inverting the relationship. */
    --color-bg-alt: color-mix(in srgb, var(--color-primary) 8%, var(--color-bg));
    --color-border: color-mix(in srgb, var(--color-ink) 12%, transparent);

    --font-display: ui-sans-serif, system-ui, -apple-system, sans-serif;
    --font-body: system-ui, -apple-system, sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, monospace;

    --radius: 10px;
    --max-width: 1080px;
    /* Taller than the text-brand default so the logo roundel has room to read */
    --header-height: 92px;
    --hero-image: none;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    font-family: var(--font-body);
    line-height: 1.5;
    color: var(--color-ink);
    background: var(--color-bg);
    padding-top: var(--header-height);
  }

  h1, h2, .brand { overflow-wrap: break-word; word-break: break-word; }

  img { max-width: 100%; display: block; }
  a { color: inherit; text-decoration: none; }
  ul { list-style: none; }

  section {
    padding: 4rem 1.5rem;
    max-width: var(--max-width);
    margin: 0 auto;
  }

  h1, h2 { font-family: var(--font-display); font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
  h2 { font-size: clamp(1.5rem, 4vw, 2.25rem); margin-bottom: 2rem; }

  /* Structural labels — the mono/heading contrast is the page's typographic signature */
  .eyebrow {
    font-family: var(--font-mono);
    font-size: 0.75rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--color-primary);
    display: block;
    margin-bottom: 0.5rem;
  }

  a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--color-primary);
    outline-offset: 2px;
  }

  .cta {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    font-family: var(--font-body);
    font-weight: 700;
    background: var(--color-primary);
    color: #fff;
    padding: 0.9rem 1.75rem;
    border-radius: var(--radius);
    border: none;
    cursor: pointer;
    font-size: 1rem;
  }

  /* --- Header --- */
  .site-header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
    padding: 0.85rem 1.25rem;
    /* Dark bar: the logo's wordmark is white, so it needs a dark backing.
       Matching the logo's own background colour is what removes the tile edge. */
    background: var(--color-secondary);
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  }
  .brand-logo {
    height: 64px;
    width: auto;
    flex-shrink: 0;
  }
  .phone-link {
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    flex-shrink: 0;
    font-family: var(--font-mono);
    font-weight: 700;
    /* On the dark bar the real logo gold finally works — paired with dark text
       instead of white, it reads at 8:1 rather than the 2.1:1 white would give. */
    background: var(--color-accent);
    color: var(--color-secondary);
    padding: 0.5rem 0.9rem;
    border-radius: 999px;
    font-size: 0.9rem;
  }

  /* --- Hero --- */
  #hero {
    position: relative;
    background-image: var(--hero-image);
    background-size: cover;
    background-position: center;
    text-align: center;
    padding-top: 5rem;
    padding-bottom: 5rem;
    max-width: none;
    overflow: hidden;
  }
  /* Plain tinted look by default; swaps to a dark scrim once a photo is set,
     so hero text stays readable regardless of what's in the image. */
  #hero::before {
    content: "";
    position: absolute;
    inset: 0;
    background: var(--color-bg-alt);
  }
  html[data-hero-image] #hero::before {
    background: linear-gradient(180deg, rgba(10,10,10,0.35), rgba(10,10,10,0.55));
  }
  #hero > * { position: relative; z-index: 1; }
  html[data-hero-image] #hero-heading { color: #fff; }
  html[data-hero-image] .trade-icon { color: #fff; }

  /* Sits under the hero CTA. Pill so it holds up over a photo as well as over
     the plain tinted hero. */
  .hero-hours {
    /* block + fit-content so it centres on its own line under the CTA rather
       than sitting inline beside it and competing with the button */
    display: block;
    width: fit-content;
    margin: 1.5rem auto 0;
    font-family: var(--font-mono);
    font-size: 0.85rem;
    letter-spacing: 0.04em;
    padding: 0.5rem 1rem;
    border-radius: 999px;
    border: 1px solid var(--color-border);
  }
  html[data-hero-image] .hero-hours {
    color: #fff;
    border-color: rgba(255, 255, 255, 0.35);
    background: rgba(0, 0, 0, 0.28);
  }

  .trade-icon {
    color: var(--color-primary);
    width: 48px;
    height: 48px;
    margin: 0 auto 1.5rem;
  }
  .trade-icon svg { width: 100%; height: 100%; }
  #hero-heading { font-size: clamp(2rem, 6vw, 3.25rem); max-width: 20ch; margin: 0 auto 2rem; }

  /* --- Services --- */
  /* Lead paragraph above the list. Wider measure than the cards but still
     capped, so the line length stays readable on a desktop-width section. */
  .services-note {
    max-width: 62ch;
    margin-bottom: 2rem;
    margin-top: -1rem; /* h2 already leaves 2rem below it; this tightens the pair */
    font-size: 1.05rem;
    color: color-mix(in srgb, var(--color-ink) 85%, transparent);
  }
  /* The Facebook link is the whole point of this paragraph, so it gets the
     brand colour and a permanent underline rather than hover-only — a link
     nobody notices is the same as no link. */
  .services-note a {
    color: var(--color-primary);
    font-weight: 700;
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  .services-list {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 1rem;
  }
  .services-list li {
    font-family: var(--font-display);
    font-weight: 700;
    padding: 1.25rem;
    background: #fff;
    border: 1px solid var(--color-border);
    border-left: 3px solid var(--color-primary);
    border-radius: var(--radius);
  }

  /* --- Testimonials --- */
  #testimonials-list {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 1.25rem;
  }
  .testimonial {
    background: #fff;
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    padding: 1.5rem;
  }
  .stars { color: var(--color-primary); letter-spacing: 0.1em; margin-bottom: 0.75rem; }
  .testimonial p:not(.testimonial-author) { font-style: italic; margin-bottom: 0.75rem; }
  .testimonial-author { font-family: var(--font-mono); font-size: 0.85rem; opacity: 0.75; }

  /* --- Gallery --- */
  /* Diagonal hatch reads clearly as "placeholder", not a broken image */
  .gallery-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 1rem;
  }
  .gallery-item {
    aspect-ratio: 4 / 3;
    border: 1px dashed var(--color-border);
    border-radius: var(--radius);
    background: repeating-linear-gradient(
      45deg,
      var(--color-bg-alt),
      var(--color-bg-alt) 10px,
      var(--color-bg) 10px,
      var(--color-bg) 20px
    );
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 1rem;
    font-family: var(--font-mono);
    font-size: 0.8rem;
    color: color-mix(in srgb, var(--color-ink) 55%, transparent);
    position: relative;
    overflow: hidden;
  }
  /* Once a photo is actually in, drop the dashed placeholder outline — dashed
     is the "nothing here yet" signal and shouldn't frame a real image. */
  .gallery-item.has-photo {
    border-style: solid;
    padding: 0;
  }
  /* Sits over the hatch label, so the label is only seen if the photo fails */
  .gallery-item img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .reviews-link {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    min-height: 44px;
    margin-top: 1.5rem;
    font-family: var(--font-mono);
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--color-primary);
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .reviews-link::after { content: "→"; }

  /* --- Contact --- */
  #contact-form {
    display: flex;
    flex-direction: column;
    gap: 1rem;
    max-width: 480px;
    background: #fff;
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    padding: 1.5rem;
  }
  #contact-form label {
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
    font-family: var(--font-mono);
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  #contact-form input, #contact-form textarea {
    font-family: var(--font-body);
    font-size: 1rem;
    padding: 0.7rem;
    border: 1px solid var(--color-border);
    border-radius: 6px;
    text-transform: none;
    letter-spacing: normal;
  }
  #contact-form textarea { min-height: 100px; resize: vertical; }
  .form-success { font-family: var(--font-display); font-weight: 700; }
  .form-error { color: #B3261E; font-size: 0.9rem; margin-top: 0.5rem; }

  /* --- Footer --- */
  footer {
    background: var(--color-secondary);
    color: #fff;
    text-align: center;
    padding: 2rem 1.5rem;
    font-family: var(--font-mono);
    font-size: 0.85rem;
  }
  /* Same trick as the header — footer already used --color-secondary, so the
     feathered logo drops straight onto it. */
  .footer-logo {
    height: 76px;
    width: auto;
    margin: 0 auto 1rem;
  }
  .footer-hours {
    margin-top: 0.4rem;
    color: var(--color-accent);
  }

  @media (prefers-reduced-motion: reduce) {
    * { scroll-behavior: auto !important; }
  }

  /* --- Mobile refinement (Pass 4) --- */
  @media (max-width: 640px) {
    section { padding: 2.5rem 1rem; }

    /* Logo scaled back so it and the phone pill still fit a 320px bar */
    :root { --header-height: 74px; }
    .site-header { padding: 0.6rem 0.9rem; }
    .brand-logo { height: 50px; }
    .footer-logo { height: 64px; }

    #hero { padding-top: 3rem; padding-bottom: 3rem; }
    #hero-heading { max-width: 100%; }

    /* Grid minimums pulled in so 320px-wide devices (iPhone SE) never overflow */
    .services-list { grid-template-columns: 1fr; }
    #testimonials-list { grid-template-columns: 1fr; }
    .gallery-grid { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }

    #contact-form { max-width: 100%; }
    #contact-form input, #contact-form textarea, #contact-form button {
      min-height: 44px; /* form fields need the same tap-target floor as buttons */
      font-size: 16px; /* iOS zooms in on inputs below 16px — this prevents that */
    }
  }
</style>
</head>
<body>

<header class="site-header">
  <img class="brand-logo" data-field="logo" alt="">
  <a class="phone-link" data-field="phone" href="#"></a>
</header>

<main>

  <section id="hero">
    <div class="trade-icon" id="trade-icon" aria-hidden="true"></div>
    <h1 id="hero-heading"></h1>
    <a class="cta" id="hero-cta" href="#"></a>
    <p class="hero-hours" data-field="hours"></p>
  </section>

  <section id="services">
    <span class="eyebrow">What we do</span>
    <h2 id="services-heading"></h2>
    <p class="services-note" id="services-note" hidden></p>
    <ul class="services-list" id="services-list"></ul>
  </section>

  <section id="testimonials">
    <span class="eyebrow">Trusted locally</span>
    <h2 id="testimonials-heading"></h2>
    <div id="testimonials-list"></div>
    <a class="reviews-link" data-field="moreReviews" href="#" target="_blank" rel="noopener noreferrer"></a>
  </section>

  <section id="gallery">
    <span class="eyebrow">Down at the van</span>
    <h2 id="gallery-heading"></h2>
    <div class="gallery-grid" id="gallery-grid"></div>
  </section>

  <section id="contact">
    <span class="eyebrow">Get in touch</span>
    <h2 id="contact-heading"></h2>
    <form id="contact-form">
      <label>Name
        <input type="text" name="name" required>
      </label>
      <label>Phone
        <input type="tel" name="phone" required>
      </label>
      <label>Email
        <input type="email" name="email" required>
      </label>
      <label>Message
        <textarea name="message" required></textarea>
      </label>
      <button type="submit" class="cta"></button>
    </form>
  </section>

</main>

<footer>
  <img class="footer-logo" data-field="logo" alt="">
  <p><span data-field="phone"></span> · <span data-field="address"></span></p>
  <p class="footer-hours" data-field="hours"></p>
</footer>

<script>
// script.js — takes content.js and renders it into the page.
// Runs at the bottom of <body>, after every element it targets already
// exists in the DOM, so no DOMContentLoaded listener needed.

// --- Text content ---
document.querySelectorAll('[data-field="businessName"]').forEach(el => {
  el.textContent = content.businessName;
});
document.querySelectorAll('[data-field="phone"]').forEach(el => {
  el.textContent = content.phone;
  if (el.tagName === "A") el.href = content.phoneHref;
});
document.querySelectorAll('[data-field="address"]').forEach(el => {
  el.textContent = content.address;
});
document.querySelectorAll('[data-field="hours"]').forEach(el => {
  el.textContent = content.hours;
});
// Logo stands in for the business name in the header and the footer, so its alt
// text has to carry the name — it's the only place the name is announced there.
document.querySelectorAll('[data-field="logo"]').forEach(el => {
  el.src = content.logo.src;
  el.alt = content.logo.alt;
});

// --- Trade icon (the signature element — swaps automatically per client,
// no design-system changes needed on reskin) ---
const TRADE_ICONS = {
  plumb: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4v6a2 2 0 0 0 2 2h4v8M14 20V10h4a2 2 0 0 0 2-2V4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  electric: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z"/></svg>',
  caf: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 9h13a2 2 0 0 1 2 2v1a3 3 0 0 1-3 3h-1M4 9v6a4 4 0 0 0 4 4h4a4 4 0 0 0 4-4V9M4 9V6h9v3" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  clean: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v4M9 7h6l1 4H8l1-4zM7 11h10l-1 9a2 2 0 0 1-2 2H10a2 2 0 0 1-2-2l-1-9z" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  default: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3" stroke-linecap="round" stroke-linejoin="round"/></svg>'
};
function pickTradeIcon(trade) {
  const key = (trade || "").toLowerCase();
  const match = Object.keys(TRADE_ICONS).find(k => k !== "default" && key.includes(k));
  return TRADE_ICONS[match || "default"];
}
document.getElementById("trade-icon").innerHTML = pickTradeIcon(content.trade);

document.getElementById("hero-heading").textContent = content.heroHeading;
const heroCta = document.getElementById("hero-cta");
heroCta.textContent = content.ctaText;
heroCta.href = content.phoneHref;

document.getElementById("services-heading").textContent = content.servicesHeading;

// Optional lead paragraph with one inline link. The content string carries a
// "{link}" token rather than an <a> tag, so the copy stays plain text and gets
// built with text nodes here — content.js can never inject markup into the page.
// Omit servicesNote entirely and the paragraph stays hidden.
const servicesNote = document.getElementById("services-note");
if (content.servicesNote) {
  const { text, linkText, url } = content.servicesNote;
  const [before, ...rest] = text.split("{link}");
  servicesNote.append(before);
  if (rest.length) {
    const a = document.createElement("a");
    a.href = url;
    a.textContent = linkText;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    servicesNote.append(a, rest.join("{link}"));
  }
  servicesNote.hidden = false;
}

const servicesList = document.getElementById("services-list");
content.services.forEach(service => {
  const li = document.createElement("li");
  li.textContent = service;
  servicesList.appendChild(li);
});

document.getElementById("testimonials-heading").textContent = content.testimonialsHeading;
const testimonialsContainer = document.getElementById("testimonials-list");
content.testimonials.forEach(t => {
  const article = document.createElement("article");
  article.className = "testimonial";

  const stars = document.createElement("div");
  stars.className = "stars";
  stars.setAttribute("aria-label", `${t.stars} out of 5 stars`);
  stars.textContent = "★".repeat(t.stars) + "☆".repeat(5 - t.stars);

  const quote = document.createElement("p");
  quote.textContent = `"${t.quote}"`;

  const author = document.createElement("p");
  author.className = "testimonial-author";
  author.textContent = `— ${t.author}`;

  article.append(stars, quote, author);
  testimonialsContainer.appendChild(article);
});

const moreReviewsLink = document.querySelector('[data-field="moreReviews"]');
moreReviewsLink.href = content.moreReviews.url;
moreReviewsLink.textContent = content.moreReviews.text;

document.getElementById("gallery-heading").textContent = content.galleryHeading;
const galleryGrid = document.getElementById("gallery-grid");
content.gallery.forEach(photo => {
  const div = document.createElement("div");
  div.className = "gallery-item";
  // The label always exists; a photo, when there is one, covers it. That way a
  // dead image URL degrades to the labelled placeholder tile instead of a
  // broken image, and entries with no src still work as before.
  div.textContent = photo.alt;
  if (photo.src) {
    const img = document.createElement("img");
    img.src = photo.src;
    img.alt = photo.alt;
    img.loading = "lazy";
    // Reverting the class too, so a failed photo goes back to looking like the
    // dashed placeholder it is rather than a solid-bordered empty tile.
    img.addEventListener("error", () => {
      img.remove();
      div.classList.remove("has-photo");
    });
    div.appendChild(img);
    div.classList.add("has-photo");
  }
  galleryGrid.appendChild(div);
});

document.getElementById("contact-heading").textContent = content.contactHeading;
document.querySelector('#contact-form button[type="submit"]').textContent = content.formButtonText;

// --- Web3Forms submit handler ---
const form = document.getElementById("contact-form");

form.addEventListener("submit", async function (e) {
  e.preventDefault();

  const submitBtn = form.querySelector('button[type="submit"]');
  const originalBtnText = submitBtn.textContent;
  submitBtn.textContent = "Sending...";
  submitBtn.disabled = true;

  const formData = new FormData(form);
  formData.append("access_key", content.web3formsKey);
  // Names the email so it's identifiable in the inbox and less likely to be
  // filtered. Web3Forms treats both as special fields.
  formData.append("subject", `New enquiry from the ${content.businessName} website`);
  formData.append("from_name", content.businessName);

  try {
    const response = await fetch("https://api.web3forms.com/submit", {
      method: "POST",
      body: formData
    });
    const result = await response.json().catch(() => ({}));

    if (response.ok && result.success) {
      form.innerHTML = '<p class="form-success">Thanks — we\'ve got your message and will call you back shortly.</p>';
    } else {
      // Surface what the API actually said. Without this the visitor-facing
      // message is the only signal, which makes a dead key indistinguishable
      // from a network drop when you're trying to debug it.
      console.error("Web3Forms rejected the submission:", response.status, result);
      throw new Error(result.message || `HTTP ${response.status}`);
    }
  } catch (err) {
    console.error("Web3Forms submission failed:", err);
    submitBtn.textContent = originalBtnText;
    submitBtn.disabled = false;
    let errorEl = form.querySelector(".form-error");
    if (!errorEl) {
      errorEl = document.createElement("p");
      errorEl.className = "form-error";
      form.appendChild(errorEl);
    }
    errorEl.textContent = "Something went wrong — please call us directly instead.";
  }
});
</script>
</body>
</html>
