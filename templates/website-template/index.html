<script>
  // Sets title, description, brand colours and structured data before first paint.
  (function () {
    const c = content, root = document.documentElement;
    const staticTitle = document.title;
    const staticDesc = document.querySelector('meta[name="description"]').getAttribute("content");
    if (staticTitle !== c.pageTitle || staticDesc !== c.metaDescription) {
      console.warn("The static <title>/description in <head> differ from content. Link previews read the static ones: update them.");
    }
    document.title = c.pageTitle;
    document.querySelector('meta[name="description"]').setAttribute("content", c.metaDescription);
    if (c.colours && c.colours.black) document.querySelector('meta[name="theme-color"]').setAttribute("content", c.colours.black);
    Object.entries(c.colours || {}).forEach(([k, v]) => root.style.setProperty("--c-" + k, v));
    if (c.heroImage) {
      root.style.setProperty("--hero-image", 'url("' + c.heroImage + '")');
      root.setAttribute("data-hero-image", "true");
    }

    // MovingCompany JSON-LD, built from content so it never drifts. Empty fields are dropped.
    const s = c.schema || {};
    const prune = o => {
      Object.keys(o).forEach(k => {
        const v = o[k];
        if (v && typeof v === "object" && !Array.isArray(v)) prune(v);
        if (v == null || v === "" || (Array.isArray(v) && !v.length)) delete o[k];
      });
      return o;
    };
    const ld = prune({
      "@context": "https://schema.org",
      "@type": "MovingCompany",
      name: c.businessName,
      url: c.siteUrl,
      description: c.metaDescription,
      telephone: s.telephone,
      email: c.email,
      logo: s.logo,
      image: s.image,
      address: {
        "@type": "PostalAddress", streetAddress: s.streetAddress, addressLocality: s.locality,
        addressRegion: s.region, postalCode: s.postcode, addressCountry: "AU"
      },
      areaServed: s.areaServed,
      openingHours: s.openingHours,
      priceRange: s.priceRange,
      sameAs: (c.links || []).map(l => l.href),
      hasOfferCatalog: (c.services || []).length ? {
        "@type": "OfferCatalog", name: "Services",
        itemListElement: c.services.map(sv => ({ "@type": "Offer", itemOffered: { "@type": "Service", name: sv.name } }))
      } : null
    });
    const tag = document.createElement("script");
    tag.type = "application/ld+json";
    tag.textContent = JSON.stringify(ld);
    document.head.append(tag);
    const empty = Object.keys(s).filter(k => !s[k]);
    if (empty.length) console.info("JSON-LD placeholders still empty: " + empty.join(", "));
  })();
</script>

<style>
  /* Design read: removalist lead-gen site for people mid-move, on their phone, comparing quotes.
     Built from their logo: white and gold lettering on a warm black, a road running through the O,
     gold rules either side of "REMOVALS • STORAGE". So: black throughout, gold for every call to
     action and accent, white type, tracked gold labels and a dashed gold "road" line as the motif.
     Always dark (the brand is), so it ignores the device's light/dark setting. */
  @font-face { font-family: "Montserrat"; font-style: normal; font-weight: 700; font-display: swap; src: url("fonts/montserrat-latin-700-normal.woff2") format("woff2"); }
  @font-face { font-family: "Montserrat"; font-style: normal; font-weight: 800; font-display: swap; src: url("fonts/montserrat-latin-800-normal.woff2") format("woff2"); }
  @font-face { font-family: "Outfit"; font-style: normal; font-weight: 400; font-display: swap; src: url("fonts/outfit-latin-400-normal.woff2") format("woff2"); }
  @font-face { font-family: "Outfit"; font-style: normal; font-weight: 500; font-display: swap; src: url("fonts/outfit-latin-500-normal.woff2") format("woff2"); }

  :root {
    color-scheme: dark;

    --c-black: #140B06;
    --c-deep: #0C0603;
    --c-black2: #1C120B;
    --c-surface: #251810;
    --c-gold: #C69548;
    --c-goldDeep: #B07734;
    --c-goldText: #D9A75A;
    --c-onGold: #140B06;
    --c-white: #FCFBFB;
    --c-muted: #BFB3A8;

    --bg: var(--c-black);
    --ink: var(--c-white);
    --muted: var(--c-muted);
    --line: rgba(198, 149, 72, 0.22);   /* plain fallback for browsers without color-mix(); keep in step with colours.gold */
    --line-soft: rgba(252, 251, 251, 0.1);
    --field: var(--c-black);
    --field-border: rgba(252, 251, 251, 0.42);
    --gold-grad: linear-gradient(100deg, var(--c-gold) 0%, #D4A253 45%, var(--c-goldDeep) 100%);

    --font: "Outfit", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-display: "Montserrat", "Outfit", ui-sans-serif, system-ui, sans-serif;
    --r: 12px;
    --max: 1200px;
    --header-h: 68px;
    --hero-image: none;
  }
  @supports (color: color-mix(in srgb, red 50%, blue)) {
    :root { --line: color-mix(in srgb, var(--c-gold) 22%, transparent); }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  /* scroll-padding keeps anything scrolled to (anchor jumps, tabbing) clear of the sticky header
     and, on phones, the fixed call bar. */
  html { -webkit-text-size-adjust: 100%; background: var(--bg); scroll-padding-top: calc(var(--header-h) + 12px); }
  @media (max-width: 767px) { html { scroll-padding-bottom: calc(84px + env(safe-area-inset-bottom)); } }
  /* Sections land flush under the header; the extra 12px stays for focused controls and the form card. */
  section[id] { scroll-margin-top: -12px; }
  @media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
  body {
    font-family: var(--font);
    font-size: 1.0625rem;
    line-height: 1.55;
    color: var(--ink);
    background: var(--bg);
  }
  img { max-width: 100%; display: block; }
  a { color: inherit; text-decoration: none; }
  ul, ol { list-style: none; }
  .ico { display: inline-block; width: 1em; height: 1em; line-height: 1; flex-shrink: 0; vertical-align: -0.125em; }
  .ico svg { display: block; width: 100%; height: 100%; }

  h1, h2, h3 { font-family: var(--font-display); font-weight: 800; letter-spacing: -0.025em; line-height: 1.08; overflow-wrap: break-word; }
  h2 { font-size: clamp(1.95rem, 4.6vw, 3.1rem); }
  h3 { font-size: 1.18rem; letter-spacing: -0.01em; line-height: 1.25; }
  /* No single word stranded on a last line (browsers without it just ignore it). */
  p, h3, li { text-wrap: pretty; }

  :focus-visible { outline: 3px solid var(--c-gold); outline-offset: 3px; }

  .wrap { max-width: var(--max); margin: 0 auto; }
  .sec { padding: clamp(3.5rem, 8vw, 6.5rem) 1.25rem; }
  .sec-alt { background: var(--c-black2); }
  .sec-head { margin-bottom: clamp(1.75rem, 4vw, 3rem); }
  .sec-head p:not(.eyebrow) { margin-top: 0.9rem; color: var(--muted); font-size: 1.15rem; max-width: 52ch; }

  /* Tracked gold label with a rule, like "REMOVALS • STORAGE" on the logo. */
  .eyebrow {
    display: inline-flex; align-items: center; gap: 0.75rem; margin-bottom: 0.9rem;
    font-family: var(--font-display); font-weight: 700; font-size: 0.8rem; letter-spacing: 0.24em; text-transform: uppercase;
    color: var(--c-goldText);
  }
  .eyebrow::before { content: ""; width: 34px; height: 2px; border-radius: 1px; background: var(--c-gold); }
  .eyebrow .ico { font-size: 1rem; margin-left: -0.2rem; }
  .gold { background: var(--gold-grad); -webkit-background-clip: text; background-clip: text; color: transparent; }

  /* Dashed gold road line: the logo's road, used as a divider. */
  .road { height: 4px; background: repeating-linear-gradient(90deg, var(--c-gold) 0 30px, transparent 30px 54px); opacity: 0.55; }

  .skip-link { position: absolute; left: 0.75rem; top: -100px; z-index: 100; padding: 0.75rem 1rem; border-radius: var(--r); background: var(--c-gold); color: var(--c-onGold); font-weight: 700; }
  .skip-link:focus { top: 0.75rem; }

  /* ---------- Buttons ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 0.6rem;
    min-height: 56px; padding: 0.9rem 1.6rem;
    font-family: var(--font); font-size: 1.1rem; font-weight: 700; white-space: nowrap;
    border-radius: var(--r); border: 0; cursor: pointer;
    transition: transform 0.15s ease, filter 0.15s ease, background-color 0.15s ease;
  }
  .btn:active { transform: translateY(1px) scale(0.98); }
  .btn-gold { background: var(--gold-grad); background-color: var(--c-gold); color: var(--c-onGold); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25); }
  .btn-gold:hover { filter: brightness(1.08); }
  .btn-line { background: transparent; color: var(--c-white); box-shadow: inset 0 0 0 2px rgba(252, 251, 251, 0.75); }
  .btn-line:hover { background: rgba(252, 251, 251, 0.08); }
  .btn-dark { background: var(--c-black); color: var(--c-white); }
  .btn-dark:hover { background: var(--c-deep); }

  /* ---------- Preview strip ---------- */
  .preview-strip { background: var(--c-deep); color: var(--muted); font-size: 0.82rem; font-weight: 500; text-align: center; padding: 0.4rem 1rem; border-bottom: 1px solid var(--line-soft); }

  /* ---------- Header ---------- */
  .site-header {
    position: sticky; top: 0; z-index: 50; height: var(--header-h);
    display: flex; align-items: center; background: var(--c-black); border-bottom: 1px solid transparent;
    transition: border-color 0.2s ease;
  }
  .site-header.scrolled { border-bottom-color: var(--line); }
  .site-header .wrap { width: 100%; max-width: calc(var(--max) + 2.5rem); display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 0 1.25rem; }
  .brand { display: flex; align-items: center; min-width: 0; transition: opacity 0.2s ease, visibility 0.2s ease; }
  .brand-logo { height: 40px; width: auto; }
  .brand-text { font-family: var(--font-display); font-weight: 800; font-size: 1.15rem; }
  /* The hero shows the big logo, so the header one waits until that has scrolled away. */
  .hero-logo-live .site-header:not(.scrolled) .brand { opacity: 0; visibility: hidden; }
  .nav { display: none; gap: 1.75rem; font-weight: 500; }
  .nav a { color: var(--muted); }
  .nav a:hover { color: var(--c-white); }
  @media (min-width: 960px) { .nav { display: flex; margin-left: auto; margin-right: 0.5rem; } }
  .header-cta { min-height: 46px; padding: 0.5rem 1rem; font-size: 1rem; flex-shrink: 0; margin-left: auto; }
  @media (min-width: 960px) { .header-cta { margin-left: 0; } }
  .cta-short { display: none; }
  @media (max-width: 400px) { .cta-long { display: none; } .cta-short { display: inline; } }
  /* Phones and tablets: no header at all at the top (the hero logo and buttons are right there).
     It slides in, with the logo, once the hero logo has scrolled away. On phones the call bar
     carries the call button, so the header shows just the logo. Phones held sideways (wide but
     short, no call bar) keep the sticky header so a call button is always on screen. */
  @media (max-width: 767px), (max-width: 959px) and (min-height: 600px) {
    .hero-logo-live .site-header { position: fixed; left: 0; right: 0; transition: transform 0.25s ease, visibility 0s, border-color 0.2s ease; }
    .hero-logo-live .site-header:not(.scrolled) { transform: translateY(-100%); visibility: hidden; transition: transform 0.25s ease, visibility 0s 0.25s; }
  }
  @media (max-width: 767px) { .header-cta { display: none; } }

  /* ---------- Hero ---------- */
  .hero {
    position: relative; isolation: isolate; overflow: hidden;
    padding: clamp(1.25rem, 4vw, 3.5rem) 1.25rem clamp(2rem, 5vw, 4rem);
    background:
      radial-gradient(55% 45% at 75% 70%, color-mix(in srgb, var(--c-gold) 9%, transparent) 0%, transparent 70%),
      var(--c-black);
  }
  html[data-hero-image] .hero { min-height: min(84vh, 780px); min-height: min(84dvh, 780px); display: flex; align-items: center; background: var(--hero-image) center / cover, var(--c-black); }
  html[data-hero-image] .hero::before {
    content: ""; position: absolute; inset: 0; z-index: -1;
    background: linear-gradient(90deg, rgba(20, 11, 6, 0.9) 0%, rgba(20, 11, 6, 0.65) 55%, rgba(20, 11, 6, 0.35) 100%);
  }
  .hero .wrap { width: 100%; }
  .hero-grid { display: grid; gap: 1.5rem; align-items: center; }
  @media (min-width: 900px) { .hero-grid { grid-template-columns: 1.1fr 1fr; gap: 3rem; } }
  .hero-logo { width: min(100%, 560px); height: auto; margin: 0 0 1.5rem -0.35rem; }
  /* em, not ch: ch changes when the web font swaps in and would make the buttons jump. */
  .hero h1 { font-size: clamp(1.95rem, 6.4vw, 3.6rem); max-width: 10.3em; text-wrap: balance; }
  .hero-sub { margin-top: 1rem; font-size: clamp(1.1rem, 2vw, 1.35rem); max-width: 36ch; color: var(--muted); line-height: 1.45; }
  .hero-actions { margin-top: 1.6rem; display: flex; flex-wrap: wrap; gap: 0.75rem; }
  @media (max-width: 480px) { .hero-actions .btn { width: 100%; } }
  .hero-text { margin-top: 1rem; color: var(--muted); font-size: 1rem; }
  .hero-text a { color: var(--c-white); font-weight: 700; text-decoration: underline; text-decoration-color: var(--c-gold); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  .hero-visual img { width: 100%; max-width: 620px; height: auto; margin: 0 auto; }

  /* ---------- Facts bar ---------- */
  .facts { background: var(--c-black2); border-block: 1px solid var(--line); padding: 1.75rem 1.25rem; }
  .facts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.4rem 1rem; }
  @media (min-width: 900px) { .facts-grid { grid-template-columns: repeat(4, 1fr); gap: 1.5rem; } }
  @media (max-width: 359px) { .facts-grid { grid-template-columns: 1fr; } }
  .fact { display: flex; gap: 0.75rem; align-items: flex-start; }
  .fact > .ico { font-size: 1.3rem; padding: 0.5rem; box-sizing: content-box; border-radius: 10px; background: color-mix(in srgb, var(--c-gold) 14%, transparent); color: var(--c-goldText); }
  .fact-value { font-family: var(--font-display); font-weight: 700; font-size: 1rem; line-height: 1.25; }
  .fact-label { font-size: 0.92rem; color: var(--muted); line-height: 1.35; margin-top: 0.2rem; }
  .fact a.fact-value { text-decoration: underline; text-underline-offset: 3px; }
  /* Phones: icon and short value only (the services right below spell it out). */
  @media (max-width: 560px) { .fact:not(:has(.stars)) .fact-label { display: none; } .fact { align-items: center; } }
  .stars { display: inline-flex; gap: 2px; font-size: 0.95rem; margin-top: 0.25rem; color: var(--c-gold); }

  /* ---------- Services ---------- */
  .svc-grid { display: grid; grid-template-columns: 1fr; gap: 0.85rem; }
  @media (min-width: 768px) {
    .svc-grid { grid-template-columns: repeat(3, 1fr); gap: 1rem; grid-auto-flow: dense; }
    .svc-card.wide { grid-column: span 2; }
  }
  .svc-card {
    display: grid; grid-template-columns: auto 1fr; gap: 0.25rem 1rem; align-items: start;
    background: var(--c-surface); border: 1px solid var(--line); border-radius: var(--r); padding: 1.25rem;
    align-content: start;
  }
  .svc-icon { grid-row: span 2; width: 52px; height: 52px; display: grid; place-items: center; border-radius: var(--r); background: color-mix(in srgb, var(--c-gold) 14%, transparent); color: var(--c-goldText); font-size: 1.55rem; }
  .svc-card p { color: var(--muted); font-size: 1rem; line-height: 1.45; text-wrap: balance; }
  .svc-photo { grid-column: 1 / -1; width: 100%; aspect-ratio: 16 / 10; object-fit: cover; border-radius: calc(var(--r) - 4px); margin-bottom: 0.75rem; }
  @media (min-width: 768px) {
    .svc-card { grid-template-columns: 1fr; padding: 1.5rem; }
    .svc-icon { grid-row: auto; margin-bottom: 1rem; }
  }
  .svc-cta { background: var(--gold-grad); background-color: var(--c-gold); color: var(--c-onGold); border-color: transparent; display: flex; flex-direction: column; justify-content: center; gap: 0.35rem; }
  .svc-cta p { color: var(--c-onGold); }
  .svc-cta .btn { margin-top: 0.85rem; align-self: flex-start; min-height: 50px; padding: 0.6rem 1.2rem; font-size: 1rem; }
  .svc-cta :focus-visible { outline-color: var(--c-onGold); }
  @media (max-width: 480px) { .svc-cta .btn { align-self: stretch; } }

  /* ---------- Storage feature ---------- */
  .feature { display: grid; gap: 2rem; align-items: center; }
  @media (min-width: 900px) { .feature { grid-template-columns: 1fr 1fr; gap: 4rem; } }
  .feature-media { background: radial-gradient(70% 70% at 50% 60%, color-mix(in srgb, var(--c-gold) 8%, var(--c-surface)) 0%, var(--c-surface) 75%); border: 1px solid var(--line); border-radius: var(--r); padding: clamp(1rem, 3vw, 2rem); }
  .feature-media img { width: 100%; height: auto; }
  .feature-body p:not(.eyebrow) { margin-top: 1rem; color: var(--muted); font-size: 1.15rem; max-width: 44ch; }
  .feature-body .btn { margin-top: 1.75rem; }
  @media (max-width: 480px) { .feature-body .btn { width: 100%; } }

  /* ---------- Work (shown once real photos are in) ---------- */
  .ba-grid { display: grid; gap: 1.5rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); }
  .ba-stage { position: relative; aspect-ratio: 4 / 3; overflow: hidden; border-radius: var(--r); --pos: 50%; background: var(--c-surface); }
  .ba-stage img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .ba-before { clip-path: inset(0 calc(100% - var(--pos)) 0 0); }
  .ba-line { position: absolute; top: 0; bottom: 0; left: var(--pos); width: 3px; background: var(--c-white); transform: translateX(-50%); pointer-events: none; }
  .ba-knob {
    position: absolute; top: 50%; left: var(--pos); transform: translate(-50%, -50%);
    width: 48px; height: 48px; border-radius: var(--r); background: var(--c-gold); color: var(--c-onGold);
    display: grid; place-items: center; font-size: 1.4rem; pointer-events: none;
  }
  .ba-stage input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: ew-resize; margin: 0; }
  .ba-stage:has(input:focus-visible) { outline: 3px solid var(--c-gold); outline-offset: 3px; }
  .ba-caption { display: flex; justify-content: space-between; gap: 1rem; margin-top: 0.75rem; font-weight: 600; }
  .ba-caption span:nth-child(2) { color: var(--muted); font-weight: 500; text-align: center; }
  .gallery { margin-top: 3rem; columns: 2; column-gap: 1rem; }
  @media (min-width: 768px) { .gallery { columns: 3; } }
  .gallery img { width: 100%; margin-bottom: 1rem; border-radius: var(--r); break-inside: avoid; }

  /* ---------- Reviews (shown once real reviews are in) ---------- */
  .rev { display: grid; gap: 1.25rem; }
  @media (min-width: 900px) { .rev { grid-template-columns: 5fr 7fr; } }
  .rev.rev-single { grid-template-columns: 1fr; max-width: 760px; }
  .rev-feature {
    background: var(--gold-grad); background-color: var(--c-gold); color: var(--c-onGold); border-radius: var(--r);
    padding: clamp(1.75rem, 4vw, 2.75rem); display: flex; flex-direction: column; justify-content: space-between; gap: 2rem;
  }
  .rev-feature .stars { color: var(--c-onGold); }
  .rev-feature blockquote { font-size: clamp(1.35rem, 2.6vw, 1.9rem); font-weight: 600; line-height: 1.3; letter-spacing: -0.01em; }
  .rev-list { display: grid; gap: 1rem; align-content: start; }
  .rev-card { background: var(--c-surface); border: 1px solid var(--line); border-radius: var(--r); padding: 1.5rem; }
  .rev-card blockquote { font-size: 1.1rem; margin: 0.6rem 0 1rem; }
  .rev-author { font-weight: 700; }
  .rev-meta { font-size: 0.95rem; color: var(--muted); }
  .rev-meta a { text-decoration: underline; text-underline-offset: 3px; }
  .rev-feature .rev-meta { color: var(--c-onGold); }

  /* ---------- Process ---------- */
  .proc { display: grid; gap: 2rem; }
  @media (min-width: 900px) { .proc { grid-template-columns: 5fr 7fr; align-items: start; } }
  .step { display: grid; grid-template-columns: 56px 1fr; gap: 1rem; padding: 1.3rem 0; border-top: 1px solid var(--line); }
  .step:first-child { border-top: 0; padding-top: 0; }
  .step-icon { position: relative; width: 56px; height: 56px; border-radius: var(--r); background: var(--gold-grad); background-color: var(--c-gold); color: var(--c-onGold); display: grid; place-items: center; font-size: 1.5rem; }
  .step-num { position: absolute; top: -8px; right: -8px; width: 24px; height: 24px; border-radius: 50%; background: var(--c-white); color: var(--c-black); font-family: var(--font-display); font-size: 0.78rem; font-weight: 800; display: grid; place-items: center; }
  .step p { color: var(--muted); margin-top: 0.3rem; }

  /* ---------- Quote / contact ---------- */
  #quote { background: radial-gradient(70% 60% at 15% 20%, color-mix(in srgb, var(--c-gold) 7%, transparent) 0%, transparent 70%), var(--c-black2); border-top: 1px solid var(--line); }
  .contact-grid { display: grid; gap: 2rem; }
  @media (min-width: 900px) {
    .contact-grid { grid-template-columns: 5fr 6fr; align-items: start; gap: 4rem; }
    .contact-grid > div:first-child { position: sticky; top: calc(var(--header-h) + 2rem); }
  }
  .contact-sub { margin-top: 1rem; font-size: 1.15rem; color: var(--muted); max-width: 40ch; }
  .promises { margin-top: 1.5rem; display: grid; gap: 0.7rem; }
  .promises li { display: flex; gap: 0.7rem; align-items: center; font-size: 1.08rem; font-weight: 500; }
  .promises .ico { font-size: 1.35rem; color: var(--c-gold); }
  .big-phone { display: inline-flex; align-items: center; gap: 0.7rem; margin-top: 1.75rem; font-family: var(--font-display); font-size: clamp(1.7rem, 4.4vw, 2.5rem); font-weight: 800; letter-spacing: -0.02em; }
  .big-phone .ico { color: var(--c-gold); }
  .contact-alt { margin-top: 0.6rem; display: flex; flex-wrap: wrap; gap: 0.4rem 1.25rem; font-weight: 600; }
  .contact-alt a { display: inline-flex; align-items: center; gap: 0.45rem; min-height: 40px; text-decoration: underline; text-decoration-color: var(--c-gold); text-underline-offset: 4px; overflow-wrap: anywhere; }

  .form-card { background: var(--c-surface); border: 1px solid var(--line); border-radius: var(--r); padding: clamp(1.25rem, 3vw, 2.25rem); box-shadow: 0 30px 60px -30px rgba(0, 0, 0, 0.8); }
  .form-title { font-size: 1.35rem; margin-bottom: 0.25rem; }
  .form-req { font-size: 0.95rem; color: var(--muted); margin-bottom: 1.1rem; }
  #quote-form { display: grid; gap: 1rem; }
  .form-row { display: grid; gap: 1rem; }
  @media (min-width: 520px) { .form-row { grid-template-columns: 1fr 1fr; } }
  .field { display: grid; gap: 0.4rem; font-weight: 600; font-size: 0.98rem; min-width: 0; }
  .opt { font-weight: 400; color: var(--muted); }
  #quote-form input:not([type="radio"]):not([type="checkbox"]), #quote-form select, #quote-form textarea {
    width: 100%; min-width: 0; font-family: var(--font); font-size: 1rem; color: var(--ink); background-color: var(--field);
    min-height: 52px; padding: 0.75rem 0.9rem; border: 1.5px solid var(--field-border); border-radius: var(--r);
    -webkit-appearance: none; appearance: none;
  }
  #quote-form input::placeholder, #quote-form textarea::placeholder { color: var(--muted); opacity: 0.8; }
  #quote-form input::-webkit-date-and-time-value { text-align: left; }
  #quote-form input::-webkit-calendar-picker-indicator { cursor: pointer; }
  #quote-form select {
    padding-right: 2.5rem; cursor: pointer;
    background-image: linear-gradient(45deg, transparent 50%, var(--c-gold) 50%), linear-gradient(135deg, var(--c-gold) 50%, transparent 50%);
    background-position: calc(100% - 20px) 52%, calc(100% - 14px) 52%;
    background-size: 6px 6px; background-repeat: no-repeat;
  }
  #quote-form select option { background: var(--c-black); color: var(--c-white); }
  #quote-form textarea { min-height: 104px; resize: vertical; }
  #quote-form :is(input, select, textarea):focus-visible { outline: 3px solid var(--c-gold); outline-offset: 1px; border-color: var(--c-gold); }
  .choice { border: 0; min-width: 0; }
  .choice legend { font-weight: 600; font-size: 0.98rem; margin-bottom: 0.45rem; padding: 0; }
  .choice-opts { display: flex; flex-wrap: wrap; gap: 0.5rem; }
  .choice-opt { display: inline-flex; align-items: center; gap: 0.55rem; min-height: 46px; padding: 0.5rem 0.9rem; border: 1.5px solid var(--field-border); border-radius: var(--r); font-weight: 500; cursor: pointer; }
  .choice-opt input { width: 1.15rem; height: 1.15rem; accent-color: var(--c-gold); margin: 0; }
  .choice-opt:has(input:checked) { border-color: var(--c-gold); background: color-mix(in srgb, var(--c-gold) 14%, transparent); }
  .choice-opt:has(input:focus-visible) { outline: 3px solid var(--c-gold); outline-offset: 2px; }
  @media (max-width: 519px) { .choice-opt { flex: 1 1 auto; } }
  /* Optional fields tucked into a "+" panel. Closed panels still submit their values. */
  .more { border: 1.5px solid var(--field-border); border-radius: var(--r); }
  .more summary { cursor: pointer; list-style: none; display: flex; align-items: center; justify-content: space-between; gap: 1rem; min-height: 52px; padding: 0.7rem 0.9rem; font-weight: 600; font-size: 0.98rem; }
  .more summary::-webkit-details-marker { display: none; }
  .more summary::after { content: "+"; content: "+" / ""; flex-shrink: 0; font-size: 1.5rem; font-weight: 400; line-height: 1; color: var(--c-gold); }
  .more[open] summary::after { content: "\2212"; content: "\2212" / ""; }
  .more summary:focus-visible { outline: 3px solid var(--c-gold); outline-offset: 2px; }
  .more-body { display: grid; gap: 1rem; padding: 0.25rem 0.9rem 1rem; }
  #quote-form button[type="submit"] { width: 100%; margin-top: 0.25rem; }
  .form-note { font-size: 0.95rem; color: var(--muted); }
  .form-note a { color: var(--c-goldText); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
  .form-success { font-size: 1.25rem; font-weight: 700; line-height: 1.35; }
  .form-success:focus { outline: none; }
  .form-msg { font-weight: 600; padding: 0.85rem 1rem; border-radius: var(--r); background: color-mix(in srgb, var(--c-gold) 14%, transparent); border: 1px solid var(--line); }
  .form-error { color: #F2B8B5; background: rgba(179, 38, 30, 0.18); border-color: rgba(242, 184, 181, 0.4); }
  .hp { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }

  /* ---------- FAQ ---------- */
  .faq { max-width: 820px; }
  .faq details { border-top: 1px solid var(--line); }
  .faq details:last-child { border-bottom: 1px solid var(--line); }
  .faq summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: 1.1rem 0; font-weight: 600; font-size: 1.1rem; min-height: 48px; }
  .faq summary::-webkit-details-marker { display: none; }
  /* The "/ ''" keeps the plus out of each question's accessible name. */
  .faq summary::after { content: "+"; content: "+" / ""; flex-shrink: 0; font-size: 1.6rem; font-weight: 400; line-height: 1; color: var(--c-gold); transition: transform 0.2s ease; }
  .faq details[open] summary::after { transform: rotate(45deg); }
  .faq details p { padding-bottom: 1.25rem; color: var(--muted); max-width: 62ch; }

  /* ---------- Areas (shown once confirmed) ---------- */
  .areas { display: flex; flex-wrap: wrap; gap: 0.6rem; }
  .areas li { padding: 0.6rem 1.1rem; border: 1.5px solid var(--line); border-radius: var(--r); font-weight: 600; background: var(--c-surface); }

  /* ---------- Footer ---------- */
  /* Extra bottom padding on phones so the fixed call bar never covers the last line. */
  footer { background: var(--c-deep); color: var(--c-white); padding: 0 1.25rem calc(2rem + 76px + env(safe-area-inset-bottom)); }
  @media (min-width: 768px) { footer { padding-bottom: 2rem; } }
  footer .road { margin: 0 -1.25rem 3rem; }
  .foot { display: grid; gap: 2rem; }
  @media (min-width: 768px) { .foot { grid-template-columns: 1.4fr 1fr 1fr; } }
  .foot-logo { width: 220px; height: auto; margin-bottom: 1rem; }
  .foot h2 { font-size: 1rem; line-height: 1.25; margin-bottom: 0.6rem; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--c-goldText); }
  .foot p, .foot a { color: var(--muted); }
  .foot a { display: inline-flex; align-items: center; gap: 0.5rem; min-height: 36px; }

  const s = h("span", { class: "stars", role: "img", "aria-label": label || (v + " out of 5 stars") });
  for (let i = 0; i < 5; i++) s.append(i < full ? icon("star", "fill") : (i === full && half ? icon("star-half", "fill") : icon("star")));
  return s;
};
const section = (id, cls, inner) => h("section", { id, class: cls }, h("div", { class: "wrap" }, inner));

};

// ----- Quote form -----
// Built from content.form.fields. Every control has a visible label; groups use fieldset + legend.
block("form", () => {
  const optional = f => f.required ? null : h("span", { class: "opt" }, " (optional)");
  function field(f) {
    if (f.type === "row") return h("div", { class: "form-row" }, f.fields.map(field));
    // Fields in a closed panel start empty: a pre-picked radio there would be sent as if the customer chose it.
    if (f.type === "more") return h("details", { class: "more" }, h("summary", {}, f.label), h("div", { class: "more-body" }, f.fields.map(x => field(Object.assign({}, x, { inMore: true })))));
    if (f.type === "radios" || f.type === "checks") {
      const radio = f.type === "radios";
      return h("fieldset", { class: "choice" },
        h("legend", {}, f.label, radio ? null : optional(f)),
        h("div", { class: "choice-opts" }, f.options.map((o, i) => h("label", { class: "choice-opt" },
          radio ? h("input", { type: "radio", name: f.name, value: o, checked: !f.inMore && i === 0 })
                : h("input", { type: "checkbox", name: o.name, value: "Yes" }),
          h("span", {}, radio ? o : o.label)
        )))
      );
    }
    let control;
    const base = { name: f.name, id: "f-" + f.name, required: !!f.required, autocomplete: f.autocomplete };
    if (f.type === "select") {
      control = h("select", base, h("option", { value: "" }, f.placeholder || "Choose one"), (f.options || []).map(o => h("option", {}, o)));
    } else if (f.type === "textarea") {
      control = h("textarea", Object.assign(base, { placeholder: f.placeholder, rows: "3" }));
    } else {
      control = h("input", Object.assign(base, { type: f.type, placeholder: f.placeholder }));
      if (f.type === "date") {
        const d = new Date();
        control.min = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
      }
    }
    return h("label", { class: "field", for: base.id }, h("span", {}, f.label, optional(f)), control);
  }
  const status = h("div", { class: "form-status", role: "status", "aria-live": "polite" });
  const form = h("form", { id: "quote-form" },
    fm.fields.map(field),
    h("input", { type: "checkbox", name: "botcheck", class: "hp", tabindex: "-1", autocomplete: "off", "aria-hidden": "true" }),
    h("button", { type: "submit", class: "btn btn-gold" }, fm.submitText),
    h("p", { class: "form-note" }, "Prefer to talk? ", h("a", { href: c.phoneHref }, "Call"),
      c.smsHref ? [" or ", h("a", { href: c.smsHref }, "text")] : null, " " + c.phone + "."),
    status
  );
  main.append(
    h("section", { id: "quote", class: "sec", "aria-labelledby": "quote-heading" },
      h("div", { class: "wrap contact-grid" },
        h("div", {},
          eyebrow(c.contactEyebrow),
          h("h2", { id: "quote-heading" }, c.contactHeading),
          h("p", { class: "contact-sub" }, c.contactSub),
          h("ul", { class: "promises", role: "list" }, (c.promises || []).map(p => h("li", {}, icon("check-circle", "fill"), p))),
          h("a", { class: "big-phone", href: c.phoneHref }, icon("phone-call"), c.phone),
          h("p", { class: "contact-alt" },
            c.smsHref ? h("a", { href: c.smsHref }, icon("chat-text"), "Text us") : null,
            c.email ? h("a", { href: "mailto:" + c.email }, icon("envelope-simple"), c.email) : null)
        ),
        h("div", { class: "form-card", id: "quote-card" },
          h("h3", { class: "form-title" }, fm.heading),
          fm.intro ? h("p", { class: "form-req" }, fm.intro) : null,
          form)
      )
    )
  );

  // Call bar slides away while typing (phone keyboards push it over the field).
  form.addEventListener("focusin", e => { if (e.target.matches("input, select, textarea")) bar.classList.add("typing"); });
  form.addEventListener("focusout", () => bar.classList.remove("typing"));
  // A field inside a closed "+" panel that needs fixing: open the panel so the browser can show it.
  form.addEventListener("invalid", e => { const d = e.target.closest("details"); if (d) d.open = true; }, true);

  // ----- Web3Forms submit -----
  form.addEventListener("submit", async function (e) {
    e.preventDefault();
    const say = (text, cls) => {
      status.replaceChildren(h("p", { class: "form-msg " + (cls || "") }, text));
      status.scrollIntoView({ block: "center" });   // clears the call bar on phones
    };
    // Preview: no key yet, so say so plainly instead of pretending to send.
    if (!c.web3formsKey || /YOUR_|_HERE/.test(c.web3formsKey)) { say(fm.previewNotice); return; }

    const btn = form.querySelector('button[type="submit"]');
    const original = btn.textContent;
    btn.textContent = "Sending";
    btn.disabled = true;
    const data = new FormData(form);
    data.append("access_key", c.web3formsKey);
    data.append("subject", "New quote request: " + c.businessName);
    data.append("from_name", c.businessName + " website");
    try {
      const res = await fetch("https://api.web3forms.com/submit", { method: "POST", body: data });
      const out = await res.json();
      if (!out.success) throw new Error(out.message || "Submission failed");
      // Swap the form for the thank-you, bring it into view and move focus there so screen readers read it.
      const ok = h("p", { class: "form-success", tabindex: "-1" }, fm.success);
      form.replaceChildren(ok);
      document.getElementById("quote-card").scrollIntoView({ block: "start" });
      ok.focus({ preventScroll: true });
      bar.classList.remove("typing");
    } catch (err) {
      console.error("Web3Forms:", err);
      btn.textContent = original;
      btn.disabled = false;
      say(fm.error, "form-error");
    }
  });
});

// ----- Scroll reveal -----
// Skipped for reduced motion or browsers without IntersectionObserver, so nothing is ever left
// invisible. The hero and the quote form are deliberately not in this list.
(function () {
  const calm = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (calm || !("IntersectionObserver" in window)) return;

  const groups = [
    ".facts-grid > .fact",
    "#services .sec-head, #process .sec-head, #faq .sec-head, #reviews .sec-head, #work .sec-head, #areas .sec-head",
    ".svc-grid > .svc-card",
    ".feature > div",
    ".ba-grid > figure",
    ".rev-feature",
    ".rev-list > .rev-card",
    ".steps > .step",
    ".faq",
    ".areas"
  ];
  const targets = [];
  groups.forEach(sel => {
    document.querySelectorAll(sel).forEach((el, i) => {
      el.classList.add("reveal");
      el.style.setProperty("--i", Math.min(i, 4)); // stagger within a group, capped
      targets.push(el);
    });
  });

  document.documentElement.classList.add("js-reveal");
  const io = new IntersectionObserver((entries) => {
    entries.forEach(en => {
      if (!en.isIntersecting) return;
      const el = en.target;
      el.classList.add("in");
      io.unobserve(el);
      // Once revealed, drop the reveal state so hover effects work without delay or conflict.
      const done = () => { el.classList.remove("reveal", "in"); el.style.removeProperty("--i"); };
      el.addEventListener("transitionend", function f(ev) {
        if (ev.target === el && ev.propertyName === "opacity") { el.removeEventListener("transitionend", f); done(); }
      });
      setTimeout(done, 1200);
    });
  }, { threshold: 0.1, rootMargin: "0px 0px -5% 0px" });
  targets.forEach(el => io.observe(el));
})();
</script>
