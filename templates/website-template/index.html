<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading…</title>
<meta name="description" content="">

<script>
// content.js — single source of truth for this site's content.
// Reskinning a client = editing this file only. Nothing below this file
// should ever need touching for a normal reskin.

const content = {
  // <title> and meta description — shows in the browser tab and in
  // Google search results. This IS the "say what they do in 5 seconds" rule.
  pageTitle: "Mimi's Pit Stop | Coffee & Food Trailer, Greenway ACT",
  metaDescription: "Coffee and food trailer on Mortimer Lewis Dr, Greenway ACT. Barista coffee, bacon and egg rolls, toasties and fresh treats. Call 0428 720 929.",

  businessName: "Mimi's Pit Stop",
  phone: "0428 720 929",
  phoneHref: "tel:+61428720929", // digits only after tel:, no spaces

  trade: "Local Trailer Cafe", // contains "caf" → auto-selects the coffee cup trade icon
  suburb: "Greenway",
  address: "Mortimer Lewis Dr, Greenway ACT 2900",

  heroHeading: "Barista Coffee & Real Food in Greenway",
  ctaText: "Call to Order",

  // PLACEHOLDER IMAGE — clean stock coffee shot, swap for a real photo of the
  // trailer once Mimi's send theirs. A dark overlay is applied automatically so
  // the hero text stays readable (and stays readable even if this URL 404s).
  heroImage: "https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&w=1600&q=70",

  // MOCK MENU — placeholder pricing and items, written to look right until
  // Mimi's confirm their real menu. Every line below needs client sign-off.
  servicesHeading: "On the Menu",
  services: [
    "Barista Coffee — flat white, latte, cappuccino, long black · from $4.50",
    "Iced & Cold Brew — iced latte, iced long black, cold brew · from $6.00",
    "Tea & Chai — English breakfast, earl grey, peppermint, dirty chai · from $4.00",
    "Bacon & Egg Rolls — with hash brown and your choice of relish · $11.00",
    "Toasties & Wraps — ham & cheese, chicken pesto, veggie halloumi · from $9.50",
    "Cakes & Slices — banana bread, caramel slice, muffins, brownies · from $5.00",
    "Cold Drinks — soft drinks, sparkling water, fresh juice · from $3.50"
  ],

  // PLACEHOLDER REVIEWS — these are written examples, not real customers.
  // Replace with genuine Google reviews (with names) before the site goes live.
  testimonialsHeading: "What the Regulars Say",
  testimonials: [
    { quote: "Best coffee run in Greenway. I'm there before work most days and the flat white is spot on every single time.", author: "[Placeholder — real review needed]", stars: 5 },
    { quote: "Grabbed a bacon and egg roll on the way through and it was better than half the cafes in Tuggeranong. Lovely people too.", author: "[Placeholder — real review needed]", stars: 5 }
  ],

  galleryHeading: "A Look at the Trailer",
  // PLACEHOLDER BLOCKS — the template renders these as tagged hatch tiles, not
  // photos. Swap in real shots of the trailer, the coffee and the crew once
  // Mimi's send them through (real photos beat stock every time).
  gallery: [
    { alt: "PLACEHOLDER — The trailer set up on Mortimer Lewis Dr" },
    { alt: "PLACEHOLDER — Flat white being handed out the window" },
    { alt: "PLACEHOLDER — Bacon and egg roll on the counter" },
    { alt: "PLACEHOLDER — Cakes and slices in the display case" },
    { alt: "PLACEHOLDER — Mimi behind the coffee machine" },
    { alt: "PLACEHOLDER — Morning queue of regulars" }
  ],

  contactHeading: "Find Us at the Pit Stop",
  formButtonText: "Send Us a Message",

  // TODO: swap for Mimi's own key from https://web3forms.com, or leave as-is
  // and forward leads manually — decide before launch.
  web3formsKey: "YOUR_WEB3FORMS_ACCESS_KEY_HERE",

  // Pulled from the logo: the gold wreath and the charcoal backdrop.
  // primary is the logo gold darkened to a deep bronze — buttons and the phone
  // pill put white text on this colour, and the bright logo gold (~#E0A82E)
  // only hits ~2:1 against white, which is unreadable. This keeps the hue and
  // gets to ~5.9:1. The bright gold still lives in the logo itself.
  colours: {
    primary: "#8A5A11",
    secondary: "#17161A"
  }
};
</script>
<script>
  // Runs synchronously, before first paint — sets title, meta description,
  // and colour variables immediately so there's no flash of default values.
  document.title = content.pageTitle;
  document.querySelector('meta[name="description"]').setAttribute("content", content.metaDescription);
  document.documentElement.style.setProperty("--color-primary", content.colours.primary);
  document.documentElement.style.setProperty("--color-secondary", content.colours.secondary);
  if (content.heroImage) {
    document.documentElement.style.setProperty("--hero-image", `url("${content.heroImage}")`);
    document.documentElement.setAttribute("data-hero-image", "true");
  }
</script>

<style>
  :root {
    /* Client-driven — fallback values only, real values get set above from content.js */
    --color-primary: #0057B8;
    --color-secondary: #1A1A1A;

    /* Fixed tokens — not client-driven. Arbitrary client hex can't be trusted
       for body text contrast, so ink stays constant regardless of brand colour. */
    --color-ink: #201F1D;
    --color-bg: #FAFAF9;
    --color-bg-alt: color-mix(in srgb, var(--color-primary) 6%, white);
    --color-border: color-mix(in srgb, var(--color-ink) 12%, transparent);

    --font-display: ui-sans-serif, system-ui, -apple-system, sans-serif;
    --font-body: system-ui, -apple-system, sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, monospace;

    --radius: 10px;
    --max-width: 1080px;
    --header-height: 76px;
    --hero-image: none;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    font-family: var(--font-body);
    line-height: 1.5;
    color: var(--color-ink);
    background: var(--color-bg);
    padding-top: var(--header-height);
  }

  h1, h2, .brand { overflow-wrap: break-word; word-break: break-word; }

  img { max-width: 100%; display: block; }
  a { color: inherit; text-decoration: none; }
  ul { list-style: none; }

  section {
    padding: 4rem 1.5rem;
    max-width: var(--max-width);
    margin: 0 auto;
  }

  h1, h2 { font-family: var(--font-display); font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
  h2 { font-size: clamp(1.5rem, 4vw, 2.25rem); margin-bottom: 2rem; }

  /* Structural labels — the mono/heading contrast is the page's typographic signature */
  .eyebrow {
    font-family: var(--font-mono);
    font-size: 0.75rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--color-primary);
    display: block;
    margin-bottom: 0.5rem;
  }

  a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--color-primary);
    outline-offset: 2px;
  }

  .cta {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    font-family: var(--font-body);
    font-weight: 700;
    background: var(--color-primary);
    color: #fff;
    padding: 0.9rem 1.75rem;
    border-radius: var(--radius);
    border: none;
    cursor: pointer;
    font-size: 1rem;
  }

  /* --- Header --- */
  .site-header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
    padding: 0.85rem 1.25rem;
    background: var(--color-bg);
    border-bottom: 1px solid var(--color-border);
  }
  .brand {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 1.1rem;
    min-width: 0; /* lets flex children actually shrink instead of forcing overflow */
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .phone-link {
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    flex-shrink: 0;
    font-family: var(--font-mono);
    font-weight: 700;
    background: var(--color-primary);
    color: #fff;
    padding: 0.5rem 0.9rem;
    border-radius: 999px;
    font-size: 0.9rem;
  }

  /* --- Hero --- */
  #hero {
    position: relative;
    background-image: var(--hero-image);
    background-size: cover;
    background-position: center;
    text-align: center;
    padding-top: 5rem;
    padding-bottom: 5rem;
    max-width: none;
    overflow: hidden;
  }
  /* Plain tinted look by default; swaps to a dark scrim once a photo is set,
     so hero text stays readable regardless of what's in the image. */
  #hero::before {
    content: "";
    position: absolute;
    inset: 0;
    background: var(--color-bg-alt);
  }
  html[data-hero-image] #hero::before {
    background: linear-gradient(180deg, rgba(10,10,10,0.35), rgba(10,10,10,0.55));
  }
  #hero > * { position: relative; z-index: 1; }
  html[data-hero-image] #hero-heading { color: #fff; }
  html[data-hero-image] .trade-icon { color: #fff; }

  .trade-icon {
    color: var(--color-primary);
    width: 48px;
    height: 48px;
    margin: 0 auto 1.5rem;
  }
  .trade-icon svg { width: 100%; height: 100%; }
  #hero-heading { font-size: clamp(2rem, 6vw, 3.25rem); max-width: 20ch; margin: 0 auto 2rem; }

  /* --- Services --- */
  .services-list {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 1rem;
  }
  .services-list li {
    font-family: var(--font-display);
    font-weight: 700;
    padding: 1.25rem;
    background: #fff;
    border: 1px solid var(--color-border);
    border-left: 3px solid var(--color-primary);
    border-radius: var(--radius);
  }

  /* --- Testimonials --- */
  #testimonials-list {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 1.25rem;
  }
  .testimonial {
    background: #fff;
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    padding: 1.5rem;
  }
  .stars { color: var(--color-primary); letter-spacing: 0.1em; margin-bottom: 0.75rem; }
  .testimonial p:not(.testimonial-author) { font-style: italic; margin-bottom: 0.75rem; }
  .testimonial-author { font-family: var(--font-mono); font-size: 0.85rem; opacity: 0.75; }

  /* --- Gallery --- */
  /* Diagonal hatch reads clearly as "placeholder", not a broken image */
  .gallery-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 1rem;
  }
  .gallery-item {
    aspect-ratio: 4 / 3;
    border: 1px dashed var(--color-border);
    border-radius: var(--radius);
    background: repeating-linear-gradient(
      45deg,
      var(--color-bg-alt),
      var(--color-bg-alt) 10px,
      var(--color-bg) 10px,
      var(--color-bg) 20px
    );
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 1rem;
    font-family: var(--font-mono);
    font-size: 0.8rem;
    color: color-mix(in srgb, var(--color-ink) 55%, transparent);
  }

  /* --- Contact --- */
  #contact-form {
    display: flex;
    flex-direction: column;
    gap: 1rem;
    max-width: 480px;
    background: #fff;
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    padding: 1.5rem;
  }
  #contact-form label {
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
    font-family: var(--font-mono);
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  #contact-form input, #contact-form textarea {
    font-family: var(--font-body);
    font-size: 1rem;
    padding: 0.7rem;
    border: 1px solid var(--color-border);
    border-radius: 6px;
    text-transform: none;
    letter-spacing: normal;
  }
  #contact-form textarea { min-height: 100px; resize: vertical; }
  .form-success { font-family: var(--font-display); font-weight: 700; }
  .form-error { color: #B3261E; font-size: 0.9rem; margin-top: 0.5rem; }

  /* --- Footer --- */
  footer {
    background: var(--color-secondary);
    color: #fff;
    text-align: center;
    padding: 2rem 1.5rem;
    font-family: var(--font-mono);
    font-size: 0.85rem;
  }

  @media (prefers-reduced-motion: reduce) {
    * { scroll-behavior: auto !important; }
  }

  /* --- Mobile refinement (Pass 4) --- */
  @media (max-width: 640px) {
    section { padding: 2.5rem 1rem; }

    #hero { padding-top: 3rem; padding-bottom: 3rem; }
    #hero-heading { max-width: 100%; }

    /* Grid minimums pulled in so 320px-wide devices (iPhone SE) never overflow */
    .services-list { grid-template-columns: 1fr; }
    #testimonials-list { grid-template-columns: 1fr; }
    .gallery-grid { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }

    #contact-form { max-width: 100%; }
    #contact-form input, #contact-form textarea, #contact-form button {
      min-height: 44px; /* form fields need the same tap-target floor as buttons */
      font-size: 16px; /* iOS zooms in on inputs below 16px — this prevents that */
    }
  }
</style>
</head>
<body>

<header class="site-header">
  <p class="brand" data-field="businessName"></p>
  <a class="phone-link" data-field="phone" href="#"></a>
</header>

<main>

  <section id="hero">
    <div class="trade-icon" id="trade-icon" aria-hidden="true"></div>
    <h1 id="hero-heading"></h1>
    <a class="cta" id="hero-cta" href="#"></a>
  </section>

  <section id="services">
    <span class="eyebrow">What we do</span>
    <h2 id="services-heading"></h2>
    <ul class="services-list" id="services-list"></ul>
  </section>

  <section id="testimonials">
    <span class="eyebrow">Trusted locally</span>
    <h2 id="testimonials-heading"></h2>
    <div id="testimonials-list"></div>
  </section>

  <section id="gallery">
    <span class="eyebrow">Recent work</span>
    <h2 id="gallery-heading"></h2>
    <div class="gallery-grid" id="gallery-grid"></div>
  </section>

  <section id="contact">
    <span class="eyebrow">Get in touch</span>
    <h2 id="contact-heading"></h2>
    <form id="contact-form">
      <label>Name
        <input type="text" name="name" required>
      </label>
      <label>Phone
        <input type="tel" name="phone" required>
      </label>
      <label>Message
        <textarea name="message" required></textarea>
      </label>
      <button type="submit" class="cta"></button>
    </form>
  </section>

</main>

<footer>
  <p><span data-field="businessName"></span> · <span data-field="phone"></span> · <span data-field="address"></span></p>
</footer>

<script>
// script.js — takes content.js and renders it into the page.
// Runs at the bottom of <body>, after every element it targets already
// exists in the DOM, so no DOMContentLoaded listener needed.

// --- Text content ---
document.querySelectorAll('[data-field="businessName"]').forEach(el => {
  el.textContent = content.businessName;
});
document.querySelectorAll('[data-field="phone"]').forEach(el => {
  el.textContent = content.phone;
  if (el.tagName === "A") el.href = content.phoneHref;
});
document.querySelectorAll('[data-field="address"]').forEach(el => {
  el.textContent = content.address;
});

// --- Trade icon (the signature element — swaps automatically per client,
// no design-system changes needed on reskin) ---
const TRADE_ICONS = {
  plumb: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4v6a2 2 0 0 0 2 2h4v8M14 20V10h4a2 2 0 0 0 2-2V4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  electric: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z"/></svg>',
  caf: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 9h13a2 2 0 0 1 2 2v1a3 3 0 0 1-3 3h-1M4 9v6a4 4 0 0 0 4 4h4a4 4 0 0 0 4-4V9M4 9V6h9v3" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  clean: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v4M9 7h6l1 4H8l1-4zM7 11h10l-1 9a2 2 0 0 1-2 2H10a2 2 0 0 1-2-2l-1-9z" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  default: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3" stroke-linecap="round" stroke-linejoin="round"/></svg>'
};
function pickTradeIcon(trade) {
  const key = (trade || "").toLowerCase();
  const match = Object.keys(TRADE_ICONS).find(k => k !== "default" && key.includes(k));
  return TRADE_ICONS[match || "default"];
}
document.getElementById("trade-icon").innerHTML = pickTradeIcon(content.trade);

document.getElementById("hero-heading").textContent = content.heroHeading;
const heroCta = document.getElementById("hero-cta");
heroCta.textContent = content.ctaText;
heroCta.href = content.phoneHref;

document.getElementById("services-heading").textContent = content.servicesHeading;
const servicesList = document.getElementById("services-list");
content.services.forEach(service => {
  const li = document.createElement("li");
  li.textContent = service;
  servicesList.appendChild(li);
});

document.getElementById("testimonials-heading").textContent = content.testimonialsHeading;
const testimonialsContainer = document.getElementById("testimonials-list");
content.testimonials.forEach(t => {
  const article = document.createElement("article");
  article.className = "testimonial";

  const stars = document.createElement("div");
  stars.className = "stars";
  stars.setAttribute("aria-label", `${t.stars} out of 5 stars`);
  stars.textContent = "★".repeat(t.stars) + "☆".repeat(5 - t.stars);

  const quote = document.createElement("p");
  quote.textContent = `"${t.quote}"`;

  const author = document.createElement("p");
  author.className = "testimonial-author";
  author.textContent = `— ${t.author}`;

  article.append(stars, quote, author);
  testimonialsContainer.appendChild(article);
});

document.getElementById("gallery-heading").textContent = content.galleryHeading;
const galleryGrid = document.getElementById("gallery-grid");
content.gallery.forEach(photo => {
  const div = document.createElement("div");
  div.className = "gallery-item";
  div.textContent = photo.alt; // placeholder block; swap for a real <img> per client
  galleryGrid.appendChild(div);
});

document.getElementById("contact-heading").textContent = content.contactHeading;
document.querySelector('#contact-form button[type="submit"]').textContent = content.formButtonText;

// --- Web3Forms submit handler ---
const form = document.getElementById("contact-form");

form.addEventListener("submit", async function (e) {
  e.preventDefault();

  const submitBtn = form.querySelector('button[type="submit"]');
  const originalBtnText = submitBtn.textContent;
  submitBtn.textContent = "Sending...";
  submitBtn.disabled = true;

  const formData = new FormData(form);
  formData.append("access_key", content.web3formsKey);

  try {
    const response = await fetch("https://api.web3forms.com/submit", {
      method: "POST",
      body: formData
    });
    const result = await response.json();

    if (result.success) {
      form.innerHTML = '<p class="form-success">Thanks — we\'ve got your message and will call you back shortly.</p>';
    } else {
      throw new Error(result.message || "Submission failed");
    }
  } catch (err) {
    submitBtn.textContent = originalBtnText;
    submitBtn.disabled = false;
    let errorEl = form.querySelector(".form-error");
    if (!errorEl) {
      errorEl = document.createElement("p");
      errorEl.className = "form-error";
      form.appendChild(errorEl);
    }
    errorEl.textContent = "Something went wrong — please call us directly instead.";
  }
});
</script>
</body>
</html>
